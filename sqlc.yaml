version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/modules/identity/queries/"
    schema: "migrations/"
    gen:
      go:
        package: "sqlc"
        out: "internal/modules/identity/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: "postgresql"
    queries: "internal/modules/files/queries/"
    schema: "migrations/"
    gen:
      go:
        package: "sqlc"
        out: "internal/modules/files/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: "postgresql"
    queries: "internal/modules/features/queries/"
    schema: "migrations/"
    gen:
      go:
        package: "sqlc"
        out: "internal/modules/features/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: "postgresql"
    queries: "internal/modules/webhooks/queries/"
    schema: "migrations/"
    gen:
      go:
        package: "sqlc"
        out: "internal/modules/webhooks/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
