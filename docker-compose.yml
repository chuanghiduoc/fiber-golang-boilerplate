services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      APP_PORT: ${APP_PORT:-8080}
      APP_ENV: ${APP_ENV:-local}
      # One container runs the API, job worker, and scheduler. Split into
      # api/worker services with APP_ROLE=api and APP_ROLE=worker if needed.
      APP_ROLE: ${APP_ROLE:-all}
      APP_BODY_LIMIT: ${APP_BODY_LIMIT:-12582912}
      APP_REQUEST_TIMEOUT: ${APP_REQUEST_TIMEOUT:-12s}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@localhost}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Fiber App}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-fiber-golang-boilerplate}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=fiber-golang-boilerplate,deployment.environment.name=local}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      TRACING_INSTRUMENT_DB: ${TRACING_INSTRUMENT_DB:-true}
      TRACING_SHUTDOWN_TIMEOUT: ${TRACING_SHUTDOWN_TIMEOUT:-10s}
      METRICS_OTLP_ENABLED: ${METRICS_OTLP_ENABLED:-false}
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-*}"
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      SESSION_MAX_LIFETIME: ${SESSION_MAX_LIFETIME:-720h}
      AUTH_REFRESH_COOKIE: ${AUTH_REFRESH_COOKIE:-false}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-boilerplate}
      # Runtime roles: the app role is subject to FORCE row-level security;
      # the bypass role spans tenants for jobs/retention/catalog sync. The app
      # role is not a member of the bypass role.
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD (openssl rand -base64 24)}
      DB_BYPASS_USERNAME: ${DB_BYPASS_USERNAME:-app_bypass}
      DB_BYPASS_PASSWORD: ${DB_BYPASS_PASSWORD:?set DB_BYPASS_PASSWORD (openssl rand -base64 24)}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      # Public local sample keys (base64-encoded 32 bytes); production rejects
      # them and requires distinct random keys per purpose.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -base64 32)}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY (openssl rand -base64 32)}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?set WEBHOOK_SECRET_ENCRYPTION_KEY (openssl rand -base64 32)}
      # Optional unless GOOGLE_CLIENT_ID is set; config validation enforces it
      # when OAuth is enabled.
      OAUTH_STATE_KEY: ${OAUTH_STATE_KEY:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-./uploads}
      STORAGE_MAX_FILE_SIZE: ${STORAGE_MAX_FILE_SIZE:-10485760}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-seaweedfs:8333}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-uploads}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-seaweedadmin}
      # Optional unless STORAGE_DRIVER is s3/seaweedfs; config validation
      # enforces it when the S3 backend is selected.
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_USE_SSL: ${STORAGE_S3_USE_SSL:-false}
      CACHE_DRIVER: ${CACHE_DRIVER:-memory}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - uploads_data:/app/uploads
      # The image runs as UID/GID 65532 (distroless nonroot). A named volume
      # created by an image built before that change is owned by 100:101 and is
      # not writable by the new user; recreate it once with
      # `docker compose down -v` (local data only).
    healthcheck:
      # The distroless image has no shell or HTTP client: the binary probes
      # /readyz itself (APP_PORT comes from the environment).
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: "no"
    command: ["./migrate"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-boilerplate}
      # The schema owner applies DDL; the API never uses this role.
      DB_USERNAME: ${DB_MIGRATE_USERNAME:-postgres}
      DB_PASSWORD: ${DB_MIGRATE_PASSWORD:?set DB_MIGRATE_PASSWORD (openssl rand -base64 24)}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # One-shot admin seed, after the schema exists. Account creation is never part
  # of API startup, so ADMIN_* reach this service only, not the app container.
  # cmd/seed creates a missing admin and never re-promotes existing accounts, so
  # re-running it is safe. The service is opt-in (profile "seed"): run
  # `docker compose --profile seed run --rm seed` after setting
  # ADMIN_EMAIL/ADMIN_PASSWORD. A plain `docker compose up` starts only the API
  # stack and never seeds implicitly.
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: "no"
    command: ["./seed"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-boilerplate}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD (openssl rand -base64 24)}
      DB_BYPASS_USERNAME: ${DB_BYPASS_USERNAME:-app_bypass}
      DB_BYPASS_PASSWORD: ${DB_BYPASS_PASSWORD:?set DB_BYPASS_PASSWORD (openssl rand -base64 24)}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      # The ban marker needs the dedicated data key; there is no JWT fallback.
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY (openssl rand -base64 32)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-boilerplate}
      # The container superuser owns the schema and runs migrations.
      POSTGRES_USER: ${DB_MIGRATE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_MIGRATE_PASSWORD:?set DB_MIGRATE_PASSWORD (openssl rand -base64 24)}
      # The init hook below creates both non-superuser runtime roles.
      APP_DB_USERNAME: ${DB_USERNAME:-app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD (openssl rand -base64 24)}
      APP_DB_BYPASS_USERNAME: ${DB_BYPASS_USERNAME:-app_bypass}
      APP_DB_BYPASS_PASSWORD: ${DB_BYPASS_PASSWORD:?set DB_BYPASS_PASSWORD (openssl rand -base64 24)}
      DB_SCHEMA: ${DB_SCHEMA:-public}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./deploy/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
      - ./deploy/postgres/database-roles.sql:/opt/app/database-roles.sql:ro
      # PostgreSQL 18+ images keep PGDATA in /var/lib/postgresql/<major>/docker
      # and declare the volume at /var/lib/postgresql. The volume is renamed so
      # a PostgreSQL 17 data directory is never opened by 18; a major upgrade
      # needs pg_dump/pg_restore (see docs/operations.md).
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_MIGRATE_USERNAME:-postgres} -d ${DB_DATABASE:-boilerplate}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  redis:
    image: redis:8-alpine@sha256:47b08295737773de3b711fb86f13ae802f5074e96a9a2d29f5f80164ac08c046
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # Optional OpenTelemetry collector. Tracing stays disabled unless the app is
  # started with TRACING_ENABLED=true; start this profile explicitly with
  # `docker compose --profile otel up`. The app intentionally does not depend on
  # the collector: an outage only drops spans.
  otel-collector:
    profiles: ["otel"]
    image: otel/opentelemetry-collector:0.163.2@sha256:63e5e8eccf4268be02388ba9f2dc36b80b5e47721291293411c0e83152d75bda
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - app-network

  # Optional SeaweedFS S3 gateway. The default app configuration uses local
  # disk; start this profile with `STORAGE_DRIVER=seaweedfs docker compose
  # --profile s3 up`. With no -s3.config, SeaweedFS turns AWS_ACCESS_KEY_ID /
  # AWS_SECRET_ACCESS_KEY into a single admin identity, so the app and the
  # gateway share the STORAGE_S3_* credentials.
  seaweedfs:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    ports:
      - "127.0.0.1:8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY:-seaweedadmin}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_KEY:-}
    command: server -s3 -dir=/data
    volumes:
      - seaweedfs_data:/data
    networks:
      - app-network

volumes:
  postgres18_data:
  redis_data:
  seaweedfs_data:
  uploads_data:

networks:
  app-network:
