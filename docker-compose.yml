services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      APP_PORT: ${APP_PORT:-8080}
      APP_ENV: ${APP_ENV:-local}
      # One container runs the API, job worker, and scheduler. Split into
      # api/worker services with APP_ROLE=api and APP_ROLE=worker if needed.
      APP_ROLE: ${APP_ROLE:-all}
      APP_BODY_LIMIT: ${APP_BODY_LIMIT:-12582912}
      APP_REQUEST_TIMEOUT: ${APP_REQUEST_TIMEOUT:-12}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@localhost}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Fiber App}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-fiber-golang-boilerplate}
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-fiber-golang-boilerplate}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-dev}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-local}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_INSTRUMENT_DB: ${OTEL_INSTRUMENT_DB:-true}
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-*}"
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-30}
      SESSION_MAX_LIFETIME: ${SESSION_MAX_LIFETIME:-720h}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-boilerplate}
      # Runtime roles: the app role is subject to FORCE row-level security;
      # the bypass role spans tenants for jobs/retention/catalog sync. The app
      # role is not a member of the bypass role.
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app-password}
      DB_BYPASS_USERNAME: ${DB_BYPASS_USERNAME:-app_bypass}
      DB_BYPASS_PASSWORD: ${DB_BYPASS_PASSWORD:-app-bypass-password}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-in-production}
      JWT_EXPIRE_HOUR: ${JWT_EXPIRE_HOUR:-1}
      # Empty falls back to JWT_SECRET locally; production requires its own key.
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-./uploads}
      STORAGE_MAX_FILE_SIZE: ${STORAGE_MAX_FILE_SIZE:-10485760}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-seaweedfs:8333}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-uploads}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-seaweedadmin}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-seaweedadmin}
      STORAGE_S3_USE_SSL: ${STORAGE_S3_USE_SSL:-false}
      CACHE_DRIVER: ${CACHE_DRIVER:-memory}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${APP_PORT}/readyz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: "no"
    command: ["./migrate"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-boilerplate}
      # The schema owner applies DDL; the API never uses this role.
      DB_USERNAME: ${DB_MIGRATE_USERNAME:-postgres}
      DB_PASSWORD: ${DB_MIGRATE_PASSWORD:-password}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # One-shot admin seed, after the schema exists. Account creation is never part
  # of API startup, so ADMIN_* reach this service only, not the app container.
  # cmd/seed creates a missing admin and never re-promotes existing accounts, so
  # re-running it is safe. The app does not wait for it: `docker compose up app`
  # starts the API without seeding. ADMIN_EMAIL/ADMIN_PASSWORD have no default
  # here: set them in .env (see .env.example) to seed; unset, the seed exits
  # with an error and the API keeps running.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: "no"
    command: ["./seed"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-boilerplate}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app-password}
      DB_BYPASS_USERNAME: ${DB_BYPASS_USERNAME:-app_bypass}
      DB_BYPASS_PASSWORD: ${DB_BYPASS_PASSWORD:-app-bypass-password}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-boilerplate}
      # The container superuser owns the schema and runs migrations.
      POSTGRES_USER: ${DB_MIGRATE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_MIGRATE_PASSWORD:-password}
      # The init hook below creates both non-superuser runtime roles.
      APP_DB_USERNAME: ${DB_USERNAME:-app}
      APP_DB_PASSWORD: ${DB_PASSWORD:-app-password}
      APP_DB_BYPASS_USERNAME: ${DB_BYPASS_USERNAME:-app_bypass}
      APP_DB_BYPASS_PASSWORD: ${DB_BYPASS_PASSWORD:-app-bypass-password}
      DB_SCHEMA: ${DB_SCHEMA:-public}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./deploy/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
      - ./deploy/postgres/database-roles.sql:/opt/app/database-roles.sql:ro
      # PostgreSQL 18+ images keep PGDATA in /var/lib/postgresql/<major>/docker
      # and declare the volume at /var/lib/postgresql. The volume is renamed so
      # a PostgreSQL 17 data directory is never opened by 18; a major upgrade
      # needs pg_dump/pg_restore (see docs/operations.md).
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_MIGRATE_USERNAME:-postgres} -d ${DB_DATABASE:-boilerplate}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # Optional OpenTelemetry collector. Tracing stays disabled unless the app is
  # started with OTEL_ENABLED=true; start this profile explicitly with
  # `docker compose --profile otel up`. The app intentionally does not depend on
  # the collector: an outage only drops spans.
  otel-collector:
    profiles: ["otel"]
    image: otel/opentelemetry-collector:0.162.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - app-network

  # Optional SeaweedFS S3 gateway. The default app configuration uses local
  # disk; start this profile with `STORAGE_DRIVER=seaweedfs docker compose
  # --profile s3 up`. With no -s3.config, SeaweedFS turns AWS_ACCESS_KEY_ID /
  # AWS_SECRET_ACCESS_KEY into a single admin identity, so the app and the
  # gateway share the STORAGE_S3_* credentials.
  seaweedfs:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    ports:
      - "127.0.0.1:8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY:-seaweedadmin}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_KEY:-seaweedadmin}
    command: server -s3 -dir=/data
    volumes:
      - seaweedfs_data:/data
    networks:
      - app-network

volumes:
  postgres18_data:
  redis_data:
  seaweedfs_data:
  uploads_data:

networks:
  app-network:
