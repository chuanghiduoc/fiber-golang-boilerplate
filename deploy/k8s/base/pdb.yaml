apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fiber-boilerplate
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/instance: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: api
spec:
  # With the HPA minimum of 2 replicas this permits one voluntary disruption
  # (node drain, cluster upgrade) while keeping one API pod available.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fiber-boilerplate
      app.kubernetes.io/instance: fiber-boilerplate
