apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiber-boilerplate
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/instance: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: api
spec:
  # The API only serves HTTP and enqueues jobs: it never claims them. The
  # separate worker Deployment (base/worker) runs the job worker, the scheduler,
  # and module background loops. This Deployment never runs migrations and has
  # no migration initContainer: apply migration/job.yaml and wait for it to
  # complete before rolling out (see README.md).
  #
  # The HPA owns the replica count (environment overlays set min/max); do not
  # add spec.replicas here, or the two controllers will fight over it.
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fiber-boilerplate
      app.kubernetes.io/instance: fiber-boilerplate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fiber-boilerplate
        app.kubernetes.io/instance: fiber-boilerplate
        app.kubernetes.io/part-of: fiber-boilerplate
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: fiber-boilerplate-api
      # The API does not call the Kubernetes API.
      automountServiceAccountToken: false
      enableServiceLinks: false
      # 5s preStop sleep + the API's 20s shared shutdown budget (HTTP drain,
      # async goroutines, span flush, pool close) + 5s margin. Raise this
      # together with config.ShutdownBudget; APP_REQUEST_TIMEOUT must stay
      # within the budget minus its reserves (12s max, enforced by config
      # validation).
      terminationGracePeriodSeconds: 30
      securityContext:
        # distroless/static:nonroot runs as UID/GID 65532. fsGroup lets the
        # mounted Secret files (defaultMode 0440) be read by the group.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across zones and nodes where the cluster allows it.
      # ScheduleAnyway keeps single-zone clusters usable.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fiber-boilerplate
              app.kubernetes.io/instance: fiber-boilerplate
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fiber-boilerplate
              app.kubernetes.io/instance: fiber-boilerplate
      # If the GHCR package is private, create a docker-registry secret and
      # uncomment this. Prefer making the package public when possible.
      # imagePullSecrets:
      #   - name: ghcr-pull
      containers:
        - name: api
          # The kustomize images: transformer (base/kustomization.yaml or an
          # environment overlay) rewrites this image. Replace the transformer's
          # newName/newTag, or edit this literal and migration/job.yaml together
          # when applying raw files.
          image: ghcr.io/OWNER/REPO:latest
          # The placeholder tag is mutable, so pull it on every start. Switch
          # to IfNotPresent after pinning an immutable release tag.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fiber-boilerplate-config
          env:
            - name: APP_ROLE
              value: api
            # Go's soft memory limit follows the container limit (resourceFieldRef
            # with divisor "1" yields bytes). The overlay's memory patch therefore
            # adjusts GOMEMLIMIT automatically.
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: api
                  resource: limits.memory
                  divisor: "1"
            # Secret values are files, never env values: the Secret is mounted
            # below and config resolves each <NAME>_FILE at startup. Mounting
            # also survives External Secrets refreshing the Secret (the kubelet
            # updates the projected files) without an env/envFrom snapshot.
            - name: JWT_SECRET_FILE
              value: /var/run/secrets/fiber-boilerplate/JWT_SECRET
            - name: DB_PASSWORD_FILE
              value: /var/run/secrets/fiber-boilerplate/DB_PASSWORD
            - name: DB_BYPASS_PASSWORD_FILE
              value: /var/run/secrets/fiber-boilerplate/DB_BYPASS_PASSWORD
            - name: DATA_ENCRYPTION_KEY_FILE
              value: /var/run/secrets/fiber-boilerplate/DATA_ENCRYPTION_KEY
            - name: WEBHOOK_SECRET_ENCRYPTION_KEY_FILE
              value: /var/run/secrets/fiber-boilerplate/WEBHOOK_SECRET_ENCRYPTION_KEY
            - name: OAUTH_STATE_KEY_FILE
              value: /var/run/secrets/fiber-boilerplate/OAUTH_STATE_KEY
            - name: METRICS_AUTH_TOKEN_FILE
              value: /var/run/secrets/fiber-boilerplate/METRICS_AUTH_TOKEN
            - name: REDIS_URL_FILE
              value: /var/run/secrets/fiber-boilerplate/REDIS_URL
            - name: STORAGE_S3_SECRET_KEY_FILE
              value: /var/run/secrets/fiber-boilerplate/STORAGE_S3_SECRET_KEY
            - name: SMTP_PASSWORD_FILE
              value: /var/run/secrets/fiber-boilerplate/SMTP_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            # /healthz, not /readyz: allows slow-but-reachable startup. The API
            # exits on DB/storage/cache init failure, so this does not mask a
            # dependency outage.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give kube-proxy/ingress time to stop sending new traffic before
              # the process receives SIGTERM and drains in-flight requests. This
              # is the Kubernetes-native sleep (1.30+): no shell in the
              # distroless image.
              sleep:
                seconds: 5
          # Writable scratch space. Fiber buffers multipart bodies by default,
          # but a writable /tmp avoids surprises from library temp files while
          # the image root stays read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /var/run/secrets/fiber-boilerplate
              readOnly: true
          # Production default is STORAGE_DRIVER=s3, so the root filesystem can
          # stay read-only. For STORAGE_DRIVER=local, the app writes under
          # /app/uploads and needs a WRITABLE volume shared by every replica.
          # Use a ReadWriteMany PVC (or a per-pod emptyDir for a single replica
          # only; emptyDir loses uploads on restart). Add to volumeMounts above:
          #
          # - name: uploads
          #   mountPath: /app/uploads
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: secrets
          secret:
            secretName: fiber-boilerplate-secrets
            # 0440 + fsGroup 65532 lets the nonroot user read the files without
            # making them world-readable.
            defaultMode: 0440
      # - name: uploads
      #   persistentVolumeClaim:
      #     claimName: fiber-boilerplate-uploads
