apiVersion: v1
kind: ServiceAccount
metadata:
  name: fiber-boilerplate-api
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/instance: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: api
# The API does not call the Kubernetes API. A dedicated identity also scopes
# cloud workload identity (S3 access): annotate THIS account (for example an
# EKS IRSA role-arn annotation) and no other workload inherits it. See the
# workload-identity section in README.md.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fiber-boilerplate-worker
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/instance: fiber-boilerplate-worker
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: worker
# The worker claims jobs and runs module background loops; it needs the same
# storage identity as the API and no Kubernetes API access.
automountServiceAccountToken: false
