apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fiber-boilerplate-default-deny-ingress
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
spec:
  # Deny every ingress flow in the namespace by default. The api-only policy
  # below re-allows the ingress controller; worker pods get no ingress rule, so
  # nothing can reach their health/metrics port from another pod. A pod with no
  # ingress policy at all would accept everything, which is why this deny-all
  # document exists.
  podSelector: {}
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fiber-boilerplate-api-ingress
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fiber-boilerplate
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    # Only the ingress-nginx controller pods may reach the API. Adjust the
    # namespace and pod labels if your controller runs elsewhere or your chart
    # uses different labels. Metrics scrapers need an extra rule (see below).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8080
    # Kubelet readiness/liveness probes originate from the node, not from
    # ingress-nginx. Support for node-to-pod probe traffic under NetworkPolicy
    # is CNI-dependent: many CNIs allow it implicitly, but some enforce policy.
    # If probes fail on your CNI, uncomment this rule and replace the CIDR with
    # your node (or node/pod) CIDR. Do not widen it to 0.0.0.0/0.
    #
    # - from:
    #     - ipBlock:
    #         cidr: 10.0.0.0/8
    #   ports:
    #     - protocol: TCP
    #       port: 8080
    # Optional: allow Prometheus in a "monitoring" namespace to scrape the
    # authenticated /metrics endpoint on 8080. The public Ingress excludes
    # /metrics (base/ingress.yaml), so an in-cluster scrape is the only path.
    # Uncomment and adapt the label.
    #
    # - from:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: monitoring
    #   ports:
    #     - protocol: TCP
    #       port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fiber-boilerplate-egress
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
spec:
  # The empty podSelector applies these egress rules to every pod in the
  # namespace, including the worker and the migration/seed Jobs. NetworkPolicy
  # rules are additive; this policy both denies unlisted egress and allows the
  # flows below.
  #
  # Adjust the CIDRs/ports to the managed services you actually use. The
  # 10.0.0.0/8 entries assume a private VPC peering/private service endpoint; a
  # publicly reachable database or Redis endpoint needs its provider CIDRs.
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS (CoreDNS is normally labelled k8s-app=kube-dns in kube-system).
    # For NodeLocal DNSCache, allow UDP/TCP 53 to 169.254.20.10/32 instead.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL. Narrow this to the database's security group / subnet.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
    # SeaweedFS S3 gateway (STORAGE_DRIVER=seaweedfs) on its default port.
    # Remove this rule when using AWS S3 (covered by 443 below) or narrow the
    # CIDR to the SeaweedFS service range.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 8333
    # Redis. Add 6380 here if your managed Redis uses TLS on that port.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 6379
    # OpenTelemetry collector OTLP/HTTP (4318, the default) and OTLP/gRPC
    # (4317). Narrow this CIDR to the collector's namespace/service range. The
    # app keeps running (and drops telemetry) when the collector is unreachable
    # or this rule is missing.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # SMTP submission (STARTTLS on 587; this app does not speak implicit TLS
    # on 465). Replace 0.0.0.0/0 with your relay/provider ranges if the relay
    # is reachable over the public internet.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 587
    # HTTPS: S3 API, Google OAuth token exchange, and other outbound HTTPS.
    # This is intentionally broad because S3/OAuth endpoints are external;
    # prefer a VPC endpoint or provider prefix lists to tighten it further.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
