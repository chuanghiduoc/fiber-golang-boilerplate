apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The dedicated job worker (APP_ROLE=worker). Part of the default base: every
# environment runs split api and worker Deployments. The worker has no Service
# and no Ingress; the API Service, HPA, and PDB use the api component label and
# never select these pods.
#
# Optional extras that build on this Deployment:
#   - components/keda-worker-scaler (scale on jobs_queue_lag_seconds)
#   - a bulkhead copy with JOBS_WORKER_KINDS / JOBS_WORKER_EXCLUDE_KINDS
resources:
  - deployment.yaml
