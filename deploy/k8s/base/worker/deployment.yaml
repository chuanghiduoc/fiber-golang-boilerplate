# Dedicated job worker (APP_ROLE=worker): the durable job worker, the
# scheduler, and module background loops, plus /healthz, /readyz (database and
# cache), and /metrics on 8080. It mounts no /api route, has no Service, and no
# Ingress selects it. Replicas are safe to scale: jobs are claimed with
# FOR UPDATE SKIP LOCKED and the scheduler elects one leader through
# scheduler_leases.
#
# For bulkheads, copy this Deployment under another name and set
# JOBS_WORKER_KINDS on the copy and JOBS_WORKER_EXCLUDE_KINDS here (same
# kinds), so every kind is claimed by exactly one worker group.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiber-boilerplate-worker
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/instance: fiber-boilerplate-worker
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: worker
spec:
  # Two replicas keep the scheduler lease and job claims available during a
  # rolling update or node drain. The PDB permits one voluntary disruption.
  # When the optional KEDA component manages this Deployment, remove
  # spec.replicas so the two controllers do not fight over it.
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fiber-boilerplate
      app.kubernetes.io/instance: fiber-boilerplate-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fiber-boilerplate
        app.kubernetes.io/instance: fiber-boilerplate-worker
        app.kubernetes.io/part-of: fiber-boilerplate
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: fiber-boilerplate-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The worker drains a claimed job inside the same 20s shutdown budget as
      # the API, then exits. The remaining grace covers a handler that ignores
      # cancellation and keeps heartbeating: the kubelet kills the pod at 300s,
      # which is also the default job lease duration, so another worker can
      # reclaim the job at about the same time. Keep this at or below
      # JOBS lease duration if you change either.
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # Rewritten by the same kustomize images: transformer as the API.
          image: ghcr.io/OWNER/REPO:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fiber-boilerplate-config
          env:
            - name: APP_ROLE
              value: worker
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: worker
                  resource: limits.memory
                  divisor: "1"
            - name: JWT_SECRET_FILE
              value: /var/run/secrets/fiber-boilerplate/JWT_SECRET
            - name: DB_PASSWORD_FILE
              value: /var/run/secrets/fiber-boilerplate/DB_PASSWORD
            - name: DB_BYPASS_PASSWORD_FILE
              value: /var/run/secrets/fiber-boilerplate/DB_BYPASS_PASSWORD
            - name: DATA_ENCRYPTION_KEY_FILE
              value: /var/run/secrets/fiber-boilerplate/DATA_ENCRYPTION_KEY
            - name: WEBHOOK_SECRET_ENCRYPTION_KEY_FILE
              value: /var/run/secrets/fiber-boilerplate/WEBHOOK_SECRET_ENCRYPTION_KEY
            - name: OAUTH_STATE_KEY_FILE
              value: /var/run/secrets/fiber-boilerplate/OAUTH_STATE_KEY
            - name: METRICS_AUTH_TOKEN_FILE
              value: /var/run/secrets/fiber-boilerplate/METRICS_AUTH_TOKEN
            - name: REDIS_URL_FILE
              value: /var/run/secrets/fiber-boilerplate/REDIS_URL
            - name: STORAGE_S3_SECRET_KEY_FILE
              value: /var/run/secrets/fiber-boilerplate/STORAGE_S3_SECRET_KEY
            - name: SMTP_PASSWORD_FILE
              value: /var/run/secrets/fiber-boilerplate/SMTP_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /var/run/secrets/fiber-boilerplate
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: secrets
          secret:
            secretName: fiber-boilerplate-secrets
            defaultMode: 0440
