apiVersion: batch/v1
kind: Job
metadata:
  name: fiber-boilerplate-seed
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: seed
spec:
  # One-shot admin seed. Account creation is a Job, never API startup: the
  # ADMIN_PASSWORD lives only in fiber-boilerplate-seed-secrets, which no API or
  # worker pod mounts. cmd/seed only creates a missing admin and never
  # re-promotes or re-adds an existing account, so re-running is safe.
  #
  # This Job is intentionally NOT part of the app kustomization. Apply it after
  # the migration Job (the schema must exist) and, optionally, before the app
  # rollout. The environment overlays under overlays/<env>/seed/ set the
  # namespace and image tag.
  #
  # The Job name is stable. Jobs are immutable, so delete a previous completed
  # Job before applying a changed manifest. ttlSecondsAfterFinished removes it
  # automatically after 24h.
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fiber-boilerplate
        app.kubernetes.io/part-of: fiber-boilerplate
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: Never
      serviceAccountName: fiber-boilerplate-seed
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # Private GHCR package? Create ghcr-pull (see README.md) and uncomment.
      # imagePullSecrets:
      #   - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          # The app overlay's images transformer does not update this raw Job;
          # overlays/<env>/seed/kustomization.yaml does. The deploy workflow
          # injects the same digest into both before applying either.
          image: ghcr.io/OWNER/REPO:latest
          # Mutable placeholder tag: always pull. Switch to IfNotPresent after
          # pinning an immutable release tag.
          imagePullPolicy: Always
          command: ["/app/seed"]
          envFrom:
            - configMapRef:
                name: fiber-boilerplate-config
          env:
            # ADMIN_EMAIL / ADMIN_NAME are not secrets and come from the
            # per-environment ConfigMap. The password is a mounted file.
            - name: DB_PASSWORD_FILE
              value: /var/run/secrets/fiber-boilerplate/DB_PASSWORD
            - name: DB_BYPASS_PASSWORD_FILE
              value: /var/run/secrets/fiber-boilerplate/DB_BYPASS_PASSWORD
            - name: DATA_ENCRYPTION_KEY_FILE
              value: /var/run/secrets/fiber-boilerplate/DATA_ENCRYPTION_KEY
            - name: ADMIN_PASSWORD_FILE
              value: /var/run/secrets/fiber-boilerplate-seed/ADMIN_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # cmd/seed reads the database settings from the application Secret
            # and the admin password from its own Secret.
            - name: app-secrets
              mountPath: /var/run/secrets/fiber-boilerplate
              readOnly: true
            - name: seed-secrets
              mountPath: /var/run/secrets/fiber-boilerplate-seed
              readOnly: true
      volumes:
        - name: app-secrets
          secret:
            secretName: fiber-boilerplate-secrets
            defaultMode: 0440
        - name: seed-secrets
          secret:
            secretName: fiber-boilerplate-seed-secrets
            defaultMode: 0440
