apiVersion: batch/v1
kind: Job
metadata:
  name: fiber-boilerplate-migrate
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: migrate
spec:
  # One-shot schema migration. Only cmd/migrate may apply DDL; the API and
  # seed commands never migrate.
  #
  # Apply this Job and wait for completion BEFORE rolling out deployment.yaml.
  # `kubectl apply -k deploy/k8s` does not guarantee Job-before-Deployment
  # ordering, so the README uses an explicit Job apply + `kubectl wait`.
  #
  # The Job name is stable. Jobs are immutable, so delete a previous completed
  # Job before applying a changed manifest (see README.md). ttlSecondsAfterFinished
  # removes it automatically after 24h.
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fiber-boilerplate
        app.kubernetes.io/part-of: fiber-boilerplate
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # Private GHCR package? Create ghcr-pull (see README.md) and uncomment.
      # imagePullSecrets:
      #   - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/OWNER/REPO:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/migrate"]
          envFrom:
            - configMapRef:
                name: fiber-boilerplate-config
            - secretRef:
                name: fiber-boilerplate-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
