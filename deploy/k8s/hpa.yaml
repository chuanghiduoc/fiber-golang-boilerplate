apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fiber-boilerplate
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/instance: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: api
spec:
  # The HPA owns the Deployment replica count. Deployment must not set
  # spec.replicas, or the two controllers will fight over it.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fiber-boilerplate
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      # Avoid flapping and give in-flight uploads/workers time to finish.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
