apiVersion: batch/v1
kind: Job
metadata:
  name: fiber-boilerplate-migrate
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: migrate
spec:
  # One-shot schema migration. Only cmd/migrate may apply DDL; the API and
  # seed commands never migrate.
  #
  # This Job is intentionally NOT part of the app kustomization. Apply it and
  # wait for completion BEFORE the app overlay (see README.md). The environment
  # overlays under overlays/<env>/migration/ set the namespace and image tag.
  #
  # The Job name is stable. Jobs are immutable, so delete a previous completed
  # Job before applying a changed manifest (see README.md). ttlSecondsAfterFinished
  # removes it automatically after 24h.
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fiber-boilerplate
        app.kubernetes.io/part-of: fiber-boilerplate
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: fiber-boilerplate-migrate
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # Private GHCR package? Create ghcr-pull (see README.md) and uncomment.
      # imagePullSecrets:
      #   - name: ghcr-pull
      securityContext:
        # distroless/static:nonroot runs as UID/GID 65532.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # The app overlay's images transformer does not update this raw Job;
          # overlays/<env>/migration/kustomization.yaml does. The deploy
          # workflow injects the same verified image reference (digest) into
          # the app, migration, and seed overlays before applying any.
          image: ghcr.io/OWNER/REPO:latest
          # Mutable placeholder tag: always pull. Switch to IfNotPresent after
          # pinning an immutable release tag.
          imagePullPolicy: Always
          command: ["/app/migrate"]
          envFrom:
            - configMapRef:
                name: fiber-boilerplate-config
          env:
            # Only this Job mounts the schema-owner password, and only as a
            # file: it never appears in the pod environment or `kubectl
            # describe`. DB_MIGRATE_USERNAME is the non-secret owner role name
            # in the ConfigMap.
            - name: DB_MIGRATE_PASSWORD_FILE
              value: /var/run/secrets/fiber-boilerplate-migrate/DB_MIGRATE_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: secrets
              mountPath: /var/run/secrets/fiber-boilerplate-migrate
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: fiber-boilerplate-migrate-secrets
            defaultMode: 0440
