apiVersion: v1
kind: ServiceAccount
metadata:
  name: fiber-boilerplate-migrate
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: migrate
# Only cmd/migrate runs as this identity. It has no cloud workload identity:
# schema DDL needs the database owner role, not object-storage access.
automountServiceAccountToken: false
