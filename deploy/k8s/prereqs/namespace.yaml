apiVersion: v1
kind: Namespace
metadata:
  name: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    # The manifests in this directory are written for the "restricted"
    # Pod Security Standard (non-root, no privilege escalation, seccomp).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
