# Template only. Do NOT apply this file as-is and do NOT commit real values.
#
# The schema-owner credential for cmd/migrate lives here, in a Secret separate
# from fiber-boilerplate-secrets: only the migration Job mounts this one, so
# API and worker pods can never read the role that may ALTER TABLE ... NO FORCE
# ROW LEVEL SECURITY.
#
# Create the real Secret outside the repository (or with the optional
# deploy/k8s/components/external-secrets component) and apply that generated
# file instead:
#
#   cp deploy/k8s/migrate-secret.example.yaml /tmp/fiber-migrate-secret.yaml
#   $EDITOR /tmp/fiber-migrate-secret.yaml
#   kubectl apply -f /tmp/fiber-migrate-secret.yaml
#
# No kustomization (base or environment overlay) references this file. The Job
# mounts this Secret at /var/run/secrets/fiber-boilerplate-migrate; the owner
# role NAME and any DB_MIGRATE_HOST/PORT are non-secret ConfigMap values.
apiVersion: v1
kind: Secret
metadata:
  name: fiber-boilerplate-migrate-secrets
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: migrate-secrets
type: Opaque
stringData:
  # Schema owner for DB_MIGRATE_* (cmd/migrate only). Unlike the runtime app
  # role it may run DDL.
  DB_MIGRATE_PASSWORD: "REPLACE_WITH_DB_MIGRATE_PASSWORD"
