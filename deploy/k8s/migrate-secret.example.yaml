# Template only. Do NOT apply this file as-is and do NOT commit real values.
#
# The schema-owner credentials for cmd/migrate live here, in a Secret separate
# from fiber-boilerplate-secrets: only the migration Job mounts this one, so
# API and worker pods can never read the role that may ALTER TABLE ... NO FORCE
# ROW LEVEL SECURITY.
#
# Create the real Secret outside the repository (or via External Secrets /
# Sealed Secrets) and apply that generated file instead:
#
#   cp deploy/k8s/migrate-secret.example.yaml /tmp/fiber-migrate-secret.yaml
#   $EDITOR /tmp/fiber-migrate-secret.yaml
#   kubectl apply -f /tmp/fiber-migrate-secret.yaml
#
# No kustomization (base or environment overlay) references this file.
apiVersion: v1
kind: Secret
metadata:
  name: fiber-boilerplate-migrate-secrets
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: migrate-secrets
type: Opaque
stringData:
  # Schema owner for DB_MIGRATE_* (cmd/migrate only). Unlike the runtime app
  # role it may run DDL.
  DB_MIGRATE_USERNAME: "postgres"
  DB_MIGRATE_PASSWORD: "REPLACE_WITH_DB_MIGRATE_PASSWORD"

  # Optional: connect the migration Job directly to PostgreSQL instead of the
  # API's host/port. Needed when the API goes through a transaction-mode
  # pooler; golang-migrate holds a session advisory lock.
  # DB_MIGRATE_HOST: "db.example.com"
  # DB_MIGRATE_PORT: "5432"

  # Any value above may instead be mounted as a file and referenced with
  # <NAME>_FILE (for example DB_MIGRATE_PASSWORD_FILE=/run/secrets/migrate).
