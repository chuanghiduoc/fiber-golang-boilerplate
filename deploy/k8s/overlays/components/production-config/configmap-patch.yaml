# Production ConfigMap overrides. Strategic merge keeps all unlisted base keys.
# Replace the example.com hosts and REPLACE_* bucket before applying. APP_ENV
# must stay production so the production-only safety rails remain enabled.
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: fiber-boilerplate
  name: fiber-boilerplate-config
data:
  APP_ENV: production
  LOG_LEVEL: info

  # Public API origin vs. browser frontend origin.
  APP_FRONTEND_URL: "https://app.example.com"
  CORS_ALLOW_ORIGINS: "https://app.example.com"

  # Replace with the exact ingress-nginx pod/service CIDR for this cluster, or
  # the node CIDR when the controller uses hostNetwork. Startup rejects this
  # placeholder, /0, and the broad private aggregates (including 10.0.0.0/8),
  # so a forgotten or over-broad override cannot trust spoofed X-Forwarded-For.
  APP_TRUST_PROXY: "true"
  APP_TRUSTED_PROXIES: "REPLACE_WITH_INGRESS_NGINX_POD_CIDR"

  # Managed PostgreSQL/Redis/SMTP endpoints for production.
  DB_HOST: "db.production.example.com"
  DB_MAX_CONNS: "10"
  SMTP_HOST: "smtp.production.example.com"
  EMAIL_FROM_ADDRESS: "noreply@example.com"

  # Separate bucket and credentials (credentials stay in the Secret).
  STORAGE_S3_BUCKET: "REPLACE_WITH_PRODUCTION_S3_BUCKET"
