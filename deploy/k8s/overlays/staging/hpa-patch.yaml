# Staging keeps a single warm replica to control cost. The HPA still owns the
# replica count; the Deployment intentionally has no spec.replicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  namespace: fiber-boilerplate
  name: fiber-boilerplate
spec:
  minReplicas: 1
  maxReplicas: 3
