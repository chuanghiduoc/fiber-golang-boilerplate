apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay. Resources keep their base names; environment isolation comes
# from the namespace. Replace every example.com / REPLACE_* placeholder before
# applying this overlay.
namespace: fiber-boilerplate-staging

resources:
  # The reusable base is a sibling kustomization root. Referencing `../../`
  # would make kustomize treat this overlay as nested inside the base and fail
  # with a cycle error, so the app kustomization lives in ../../base.
  - ../../base

# The deploy workflow changes newName/newTag in a temporary copy. Keep `name`
# exactly `ghcr.io/OWNER/REPO` (the stable source key); for a manual deploy set
# newName to your repository and newTag to an image produced by the Release
# workflow (normally a staging branch tag or an immutable sha-<full sha> tag).
images:
  - name: ghcr.io/OWNER/REPO
    newName: ghcr.io/OWNER/REPO
    newTag: REPLACE_WITH_IMAGE_TAG

patches:
  # The base Namespace is cluster-scoped, so the namespace transformer above
  # does not rename it. Rename it explicitly to keep the namespace object and
  # every namespaced resource in sync.
  - target:
      kind: Namespace
      name: fiber-boilerplate
    patch: |-
      - op: replace
        path: /metadata/name
        value: fiber-boilerplate-staging
  - path: hpa-patch.yaml
  - path: deployment-patch.yaml
  - path: worker-patch.yaml
  - target:
      kind: Ingress
      name: fiber-boilerplate
      namespace: fiber-boilerplate
    path: ingress-patch.yaml

components:
  - ../components/staging-config
