# Smaller staging footprint. Staging may deploy a mutable branch tag, so always
# pull to avoid running a stale cached image. Production uses IfNotPresent with
# an immutable tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: fiber-boilerplate
  name: fiber-boilerplate
spec:
  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
