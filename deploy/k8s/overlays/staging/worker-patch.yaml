# Smaller staging footprint for the worker. GOMEMLIMIT follows the memory limit
# through a resourceFieldRef, so this patch also lowers the Go soft limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: fiber-boilerplate
  name: fiber-boilerplate-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
