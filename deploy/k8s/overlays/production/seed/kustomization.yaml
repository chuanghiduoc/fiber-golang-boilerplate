apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The seed Job is intentionally applied separately, after the migration Job.
# Keeping a dedicated kustomization gives it the same namespace and image as the
# app without adding the Job to the main overlay.
namespace: fiber-boilerplate-production

resources:
  - ../../../seed

# The deploy workflow changes newName/newTag (or a digest) in a temporary copy.
# Keep `name` exactly `ghcr.io/OWNER/REPO` (the stable source key); for a manual
# deploy set it to the same image as the app overlay.
images:
  - name: ghcr.io/OWNER/REPO
    newName: ghcr.io/OWNER/REPO
    newTag: REPLACE_WITH_IMAGE_TAG

patches:
  - target:
      kind: ConfigMap
      name: fiber-boilerplate-seed-config
    patch: |-
      - op: replace
        path: /data/ADMIN_EMAIL
        value: admin@example.com
      - op: replace
        path: /data/ADMIN_NAME
        value: Admin
