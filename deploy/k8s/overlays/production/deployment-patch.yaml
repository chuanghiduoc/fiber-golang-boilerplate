# Production resource envelope. CPU requests also drive the HPA's 70%
# utilization target, so size them from measured usage before changing them.
# The image tag is immutable in this overlay (the deploy workflow sets it), so
# IfNotPresent avoids a pull on every restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: fiber-boilerplate
  name: fiber-boilerplate
spec:
  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
