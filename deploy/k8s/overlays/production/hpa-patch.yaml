# Production keeps at least three replicas and scales to 10. DB_MAX_CONNS in the
# production ConfigMap is 10 and each pod opens two pools (normal + bypass), so
# 10 replicas can hold up to 200 connections; keep that below the managed
# database's connection limit. The HPA owns the replica count; the Deployment
# intentionally has no spec.replicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  namespace: fiber-boilerplate
  name: fiber-boilerplate
spec:
  minReplicas: 3
  maxReplicas: 10
