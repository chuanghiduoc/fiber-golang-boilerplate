apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Renders base + components/image-policy so CI can validate the component
# (a Component cannot be built on its own). Do not apply this example; enable
# the component from a real environment overlay.
namespace: fiber-boilerplate

resources:
  - ../../base

components:
  - ../../components/image-policy
