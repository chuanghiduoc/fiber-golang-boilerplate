# The runtime Secret. Every key below is mounted into the api and worker pods
# at /var/run/secrets/fiber-boilerplate and read through a *_FILE variable, so
# the keys are part of the workload contract: dropping one makes the pod fail
# startup instead of silently running with an empty secret.
#
# Optional rotation keys (JWT_PREVIOUS_SECRETS, DATA_ENCRYPTION_PREVIOUS_KEYS,
# WEBHOOK_SECRET_ENCRYPTION_PREVIOUS_KEYS, GOOGLE_CLIENT_SECRET) are not
# declared here: add them to this ExternalSecret and to the Deployment's env
# when the rotation window needs them.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fiber-boilerplate-secrets
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fiber-boilerplate
  target:
    name: fiber-boilerplate-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: REPLACE_WITH_APP_SECRET_PATH
        property: JWT_SECRET
    - secretKey: DB_PASSWORD
      remoteRef:
        key: REPLACE_WITH_APP_SECRET_PATH
        property: DB_PASSWORD
    - secretKey: DB_BYPASS_PASSWORD
      remoteRef:
        key: REPLACE_WITH_APP_SECRET_PATH
        property: DB_BYPASS_PASSWORD
    - secretKey: DATA_ENCRYPTION_KEY
      remoteRef:
        key: REPLACE_WITH_APP_SECRET_PATH
        property: DATA_ENCRYPTION_KEY
    - secretKey: WEBHOOK_SECRET_ENCRYPTION_KEY
      remoteRef:
        key: REPLACE_WITH_APP_SECRET_PATH
        property: WEBHOOK_SECRET_ENCRYPTION_KEY
    - secretKey: OAUTH_STATE_KEY
      remoteRef:
        key: REPLACE_WITH_APP_SECRET_PATH
        property: OAUTH_STATE_KEY
    - secretKey: METRICS_AUTH_TOKEN
      remoteRef:
        key: REPLACE_WITH_APP_SECRET_PATH
        property: METRICS_AUTH_TOKEN
    - secretKey: REDIS_URL
      remoteRef:
        key: REPLACE_WITH_APP_SECRET_PATH
        property: REDIS_URL
    - secretKey: STORAGE_S3_SECRET_KEY
      remoteRef:
        key: REPLACE_WITH_APP_SECRET_PATH
        property: STORAGE_S3_SECRET_KEY
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: REPLACE_WITH_APP_SECRET_PATH
        property: SMTP_PASSWORD
---
# The schema-owner credential, mounted by the migration Job only.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fiber-boilerplate-migrate-secrets
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: migrate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fiber-boilerplate
  target:
    name: fiber-boilerplate-migrate-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_MIGRATE_PASSWORD
      remoteRef:
        key: REPLACE_WITH_MIGRATE_SECRET_PATH
        property: DB_MIGRATE_PASSWORD
---
# The bootstrap admin password, mounted by the seed Job only. ADMIN_EMAIL and
# ADMIN_NAME are non-secret values in the seed-only ConfigMap.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fiber-boilerplate-seed-secrets
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: seed
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fiber-boilerplate
  target:
    name: fiber-boilerplate-seed-secrets
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: REPLACE_WITH_SEED_SECRET_PATH
        property: ADMIN_PASSWORD
