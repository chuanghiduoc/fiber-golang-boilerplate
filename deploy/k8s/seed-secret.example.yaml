# Template only. Do NOT apply this file as-is and do NOT commit real values.
#
# The bootstrap admin credentials for the one-shot seed Job live here, in a
# Secret separate from fiber-boilerplate-secrets: only the seed Job mounts this
# one. The API and worker pods never receive ADMIN_*, because cmd/api no longer
# seeds at startup.
#
# Create the real Secret outside the repository (or via External Secrets /
# Sealed Secrets) and apply that generated file instead:
#
#   cp deploy/k8s/seed-secret.example.yaml /tmp/fiber-seed-secret.yaml
#   $EDITOR /tmp/fiber-seed-secret.yaml
#   kubectl apply -f /tmp/fiber-seed-secret.yaml
#
# No kustomization (base or environment overlay) references this file.
#
# Point cmd/seed at it directly (it reads only the database settings and the
# admin credentials):
#
#   kubectl -n <namespace> delete job/fiber-boilerplate-seed --ignore-not-found
#   kubectl apply -k deploy/k8s/overlays/<env>/seed
apiVersion: v1
kind: Secret
metadata:
  name: fiber-boilerplate-seed-secrets
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: seed-secrets
type: Opaque
stringData:
  # Both are required; ADMIN_PASSWORD must be at least 12 characters and must
  # not be the sample value. The short placeholder below deliberately fails
  # validation until replaced. The seed only creates a missing admin: an
  # existing demoted, banned, removed, or non-member account is left untouched.
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "REPLACE_ME"
  # Optional display name.
  ADMIN_NAME: "Admin"
