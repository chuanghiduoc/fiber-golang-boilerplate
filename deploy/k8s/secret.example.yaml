# Template only. Do NOT apply this file as-is and do NOT commit real values.
#
# Create the real Secret outside the repository (or with the optional
# deploy/k8s/components/external-secrets component) and apply that generated
# file instead:
#
#   cp deploy/k8s/secret.example.yaml /tmp/fiber-secret.yaml
#   $EDITOR /tmp/fiber-secret.yaml
#   kubectl apply -f /tmp/fiber-secret.yaml
#
# No kustomization (base or environment overlay) references this file.
#
# The api and worker pods mount this Secret as FILES at
# /var/run/secrets/fiber-boilerplate and read each value through its <NAME>_FILE
# variable (config/secretfile.go). The keys below are therefore required: the
# Deployment names every file, and a missing key fails startup instead of
# silently running without a secret. Non-secret halves of a credential pair
# (SMTP_USERNAME, STORAGE_S3_ACCESS_KEY) live in prereqs/configmap.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: fiber-boilerplate-secrets
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # PostgreSQL password for the runtime role DB_USERNAME=app
  # (prereqs/configmap.yaml). The role must not be a superuser, own tables in
  # the schema, or be a member of a BYPASSRLS role; production startup refuses
  # one.
  DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
  # Password for DB_BYPASS_USERNAME=app_bypass. That role has BYPASSRLS for
  # cross-tenant job/retention/catalog work; it must not be a superuser, own
  # tables, or be reachable with SET ROLE from the app role.
  DB_BYPASS_PASSWORD: "REPLACE_WITH_DB_BYPASS_PASSWORD"
  # The schema owner's credentials live in fiber-boilerplate-migrate-secrets
  # (migrate-secret.example.yaml), which only the migration Job mounts.

  # Base64-encoded 32 random bytes, e.g. `openssl rand -base64 32`.
  # The values below are public samples: they are valid key material so the
  # manifest applies, and production config validation refuses them, so an
  # unedited template cannot start with a known signing key.
  # Tokens carry a kid derived from it. To rotate, add the old value as the
  # JWT_PREVIOUS_SECRETS file (see below) and drop it after JWT_ACCESS_TTL.
  JWT_SECRET: ""
  # During a rotation, add JWT_PREVIOUS_SECRETS here and set
  # JWT_PREVIOUS_SECRETS_FILE in the Deployment (verify-only, comma-separated).

  # Required in every environment: AES-256-GCM key for queued email/
  # password-reset job payloads and ban markers. Base64-encoded 32 random
  # bytes, different from every other key (no JWT fallback). To rotate, add the
  # old key to DATA_ENCRYPTION_PREVIOUS_KEYS (and its _FILE variable) until
  # queued jobs drain and no ban marker names it.
  DATA_ENCRYPTION_KEY: ""

  # Required in every environment: AES-256-GCM key for stored webhook signing
  # secrets. Base64-encoded 32 random bytes, no JWT fallback. To rotate, add
  # the new key to every replica as WEBHOOK_SECRET_ENCRYPTION_PREVIOUS_KEYS
  # first, then swap active and previous; keep the old key listed until every
  # webhook secret is rotated.
  WEBHOOK_SECRET_ENCRYPTION_KEY: ""

  # Required when Google sign-in is configured: the OAuth state/PKCE signing
  # key (base64-encoded 32 random bytes). It is independent of JWT_SECRET, so
  # rotating the JWT key does not invalidate in-flight sign-ins.
  OAUTH_STATE_KEY: ""

  # Required in production and at least 16 characters. The short placeholder
  # deliberately fails validation until replaced.
  # Clients must send: Authorization: Bearer <token>
  METRICS_AUTH_TOKEN: "REPLACE_ME"

  # Managed Redis with TLS. Use rediss:// when the provider supports it.
  REDIS_URL: "rediss://:REPLACE_WITH_REDIS_PASSWORD@redis.example.com:6379/0"

  # SMTP password. Empty is valid only for an unauthenticated relay on a
  # trusted network (and only when SMTP_USERNAME is empty too).
  SMTP_PASSWORD: "REPLACE_WITH_SMTP_PASSWORD"

  # S3 secret key used when STORAGE_DRIVER is s3 or seaweedfs. Prefer workload
  # identity (README.md#workload-identity) and remove this key plus the
  # STORAGE_S3_SECRET_KEY_FILE env when you do.
  STORAGE_S3_SECRET_KEY: "REPLACE_WITH_S3_SECRET_KEY"

  # ---------------------------------------------------------------------------
  # No ADMIN_* entries here. The bootstrap admin is created by the one-shot seed
  # Job from fiber-boilerplate-seed-secrets (seed-secret.example.yaml), so API
  # and worker pods never receive ADMIN_PASSWORD.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Optional: Google OAuth. Add GOOGLE_CLIENT_SECRET here, set
  # GOOGLE_CLIENT_SECRET_FILE in the Deployment, and uncomment the matching
  # GOOGLE_CLIENT_ID plus callback URLs in prereqs/configmap.yaml; enable both
  # values or neither.
  # ---------------------------------------------------------------------------
  # GOOGLE_CLIENT_SECRET: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
