# Template only. Do NOT apply this file as-is and do NOT commit real values.
#
# Create the real Secret outside the repository (or via External Secrets /
# Sealed Secrets) and apply that generated file instead:
#
#   cp deploy/k8s/secret.example.yaml /tmp/fiber-secret.yaml
#   $EDITOR /tmp/fiber-secret.yaml
#   kubectl apply -f /tmp/fiber-secret.yaml
#
# No kustomization (base or environment overlay) references this file.
apiVersion: v1
kind: Secret
metadata:
  name: fiber-boilerplate-secrets
  namespace: fiber-boilerplate
  labels:
    app.kubernetes.io/name: fiber-boilerplate
    app.kubernetes.io/part-of: fiber-boilerplate
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # PostgreSQL password for DB_USERNAME (prereqs/configmap.yaml).
  DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD"

  # At least 32 random characters, e.g. `openssl rand -hex 32`.
  # The short placeholder deliberately fails production config validation, so
  # an unedited template cannot start with a known signing key.
  # Tokens carry a kid derived from it. To rotate, move the old value into
  # JWT_PREVIOUS_SECRETS (verify-only) and drop it after JWT_EXPIRE_HOUR.
  JWT_SECRET: "REPLACE_ME"
  # JWT_PREVIOUS_SECRETS: ""

  # Required in production: AES-256-GCM key for queued email/password-reset
  # job payloads. At least 32 random characters and different from
  # JWT_SECRET. Upgrading a deployment whose queue holds jobs sealed with the
  # old JWT_SECRET-derived key: also set DATA_ENCRYPTION_PREVIOUS_KEYS to the
  # old JWT_SECRET until those jobs drain.
  DATA_ENCRYPTION_KEY: "REPLACE_ME"
  # DATA_ENCRYPTION_PREVIOUS_KEYS: ""

  # Required in production: AES-256-GCM key for stored webhook signing secrets.
  # At least 32 random characters. To rotate, add the new key to every replica
  # as WEBHOOK_SECRET_ENCRYPTION_PREVIOUS_KEYS first, then swap active and
  # previous; keep the old key listed until every webhook secret is rotated.
  WEBHOOK_SECRET_ENCRYPTION_KEY: "REPLACE_ME"
  # WEBHOOK_SECRET_ENCRYPTION_PREVIOUS_KEYS: ""
  #
  # Any secret above may instead be mounted as a file and referenced with
  # <NAME>_FILE (for example JWT_SECRET_FILE=/run/secrets/jwt).

  # Required in production and at least 16 characters. The short placeholder
  # deliberately fails validation until replaced.
  # Clients must send: Authorization: Bearer <token>
  METRICS_AUTH_TOKEN: "REPLACE_ME"

  # Managed Redis with TLS. Use rediss:// when the provider supports it.
  REDIS_URL: "rediss://:REPLACE_WITH_REDIS_PASSWORD@redis.example.com:6379/0"

  # SMTP credentials. Leave both empty for an unauthenticated relay on a
  # trusted network; otherwise replace the placeholders.
  SMTP_USERNAME: "REPLACE_WITH_SMTP_USERNAME"
  SMTP_PASSWORD: "REPLACE_WITH_SMTP_PASSWORD"

  # S3 credentials used when STORAGE_DRIVER is s3 or seaweedfs.
  STORAGE_S3_ACCESS_KEY: "REPLACE_WITH_S3_ACCESS_KEY"
  STORAGE_S3_SECRET_KEY: "REPLACE_WITH_S3_SECRET_KEY"

  # ---------------------------------------------------------------------------
  # Optional: bootstrap one admin user when the API starts. Uncomment BOTH
  # lines or neither; ADMIN_PASSWORD must be at least 12 characters. The short
  # placeholder deliberately fails validation until replaced.
  # ---------------------------------------------------------------------------
  # ADMIN_EMAIL: "admin@example.com"
  # ADMIN_PASSWORD: "REPLACE_ME"
  # ADMIN_NAME: "Admin"

  # ---------------------------------------------------------------------------
  # Optional: Google OAuth. Uncomment this line and the matching GOOGLE_CLIENT_ID
  # plus callback URLs in prereqs/configmap.yaml; enable both values or neither.
  # ---------------------------------------------------------------------------
  # GOOGLE_CLIENT_SECRET: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
