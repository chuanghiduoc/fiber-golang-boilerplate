# Local/debug OpenTelemetry Collector configuration.
#
# This pipeline receives OTLP over gRPC (and HTTP for convenience) and prints
# batches to the collector's stdout. It is intended for `docker compose
# --profile otel up` or a local `otelcol --config` run; production should use
# a real backend exporter and authentication.
#
# The application is designed so this collector can be down: spans are dropped
# after the SDK's bounded queue fills, and startup/readiness are unaffected.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
