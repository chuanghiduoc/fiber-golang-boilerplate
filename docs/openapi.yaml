components:
  schemas:
    APIKeyResponse:
      additionalProperties: false
      properties:
        createdAt:
          description: Creation time.
          format: date-time
          type: string
        expiresAt:
          description: Absolute expiry.
          format: date-time
          type: string
        id:
          description: API key id.
          type: string
        lastUsedAt:
          description: Last successful authentication.
          format: date-time
          type: string
        name:
          description: Human-readable key name.
          type: string
        prefix:
          description: Non-secret key prefix.
          type: string
        revokedAt:
          description: Revocation time, if revoked.
          format: date-time
          type: string
        rotatedAt:
          description: Rotation time, if replaced.
          format: date-time
          type: string
        rotationGraceUntil:
          description: End of the predecessor's grace window.
          format: date-time
          type: string
        scopes:
          description: Granted permissions.
          items:
            type: string
          type:
            - array
            - "null"
        updatedAt:
          description: Last metadata update.
          format: date-time
          type: string
        userId:
          description: Owning member id.
          type: string
      required:
        - id
        - userId
        - name
        - prefix
        - scopes
        - expiresAt
        - createdAt
        - updatedAt
      type: object
    AcceptInvitationRequest:
      additionalProperties: false
      properties:
        token:
          maxLength: 256
          type: string
      required:
        - token
      type: object
    ChangePasswordRequest:
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
      required:
        - currentPassword
        - newPassword
      type: object
    CreateAPIKeyRequest:
      additionalProperties: false
      properties:
        expiresAt:
          description: Absolute expiry; defaults to the configured maximum lifetime.
          format: date-time
          type: string
        name:
          description: Human-readable key name.
          maxLength: 255
          minLength: 1
          type: string
        scopes:
          description: Permissions the key may exercise; must be held by the caller.
          items:
            type: string
          maxItems: 100
          minItems: 1
          type:
            - array
            - "null"
      required:
        - name
        - scopes
      type: object
    CreateFeatureFlagRequest:
      additionalProperties: false
      properties:
        description:
          maxLength: 500
          type:
            - string
            - "null"
        enabled:
          type:
            - boolean
            - "null"
        key:
          maxLength: 128
          type: string
        killSwitch:
          type:
            - boolean
            - "null"
      required:
        - key
        - killSwitch
        - description
      type: object
    CreateInboundSourceRequest:
      additionalProperties: false
      properties:
        name:
          description: Human-readable source name.
          maxLength: 255
          minLength: 1
          type: string
        slug:
          description: Stable lowercase slug.
          pattern: ^[a-z0-9-]{1,63}$
          type: string
        status:
          description: Initial status; defaults to active.
          enum:
            - active
            - disabled
          type: string
      required:
        - name
        - slug
      type: object
    CreateMemberNotificationRequest:
      additionalProperties: false
      properties:
        body:
          maxLength: 10000
          type: string
        data:
          additionalProperties: {}
          type: object
        title:
          maxLength: 255
          type: string
        type:
          maxLength: 100
          type: string
      required:
        - type
        - title
        - body
      type: object
    CreateNotificationResponse:
      additionalProperties: false
      properties:
        emailQueued:
          type: boolean
        notification:
          $ref: "#/components/schemas/NotificationResponse"
      required:
        - notification
        - emailQueued
      type: object
    CreateRoleRequest:
      additionalProperties: false
      properties:
        key:
          maxLength: 50
          minLength: 2
          type: string
        name:
          maxLength: 255
          minLength: 1
          type: string
        permissions:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - key
        - name
        - permissions
      type: object
    CreateTenantRequest:
      additionalProperties: false
      properties:
        locale:
          maxLength: 35
          type: string
        name:
          maxLength: 255
          minLength: 1
          type: string
        slug:
          maxLength: 63
          minLength: 2
          type: string
        status:
          enum:
            - trialing
            - active
          type: string
        timezone:
          maxLength: 64
          type: string
        trialEndsAt:
          format: date-time
          type: string
      required:
        - slug
        - name
      type: object
    CreateWebhookEndpointRequest:
      additionalProperties: false
      properties:
        description:
          description: Human-readable label.
          maxLength: 255
          type: string
        eventTypes:
          description: Event-type patterns (exact, prefix, or *); empty subscribes to everything.
          items:
            type: string
          maxItems: 20
          type:
            - array
            - "null"
        maxAttempts:
          description: Delivery attempt budget.
          format: int64
          maximum: 50
          minimum: 1
          type: integer
        status:
          description: Initial status; defaults to active.
          enum:
            - active
            - disabled
          type: string
        timeoutMs:
          description: Per-attempt request timeout in milliseconds.
          format: int64
          maximum: 120000
          minimum: 100
          type: integer
        url:
          description: Absolute http(s) receiver URL.
          maxLength: 2048
          type: string
      required:
        - url
      type: object
    CreatedAPIKeyResponse:
      additionalProperties: false
      properties:
        createdAt:
          description: Creation time.
          format: date-time
          type: string
        expiresAt:
          description: Absolute expiry.
          format: date-time
          type: string
        id:
          description: API key id.
          type: string
        key:
          description: Plaintext key. Returned once and never stored.
          type: string
        lastUsedAt:
          description: Last successful authentication.
          format: date-time
          type: string
        name:
          description: Human-readable key name.
          type: string
        prefix:
          description: Non-secret key prefix.
          type: string
        revokedAt:
          description: Revocation time, if revoked.
          format: date-time
          type: string
        rotatedAt:
          description: Rotation time, if replaced.
          format: date-time
          type: string
        rotationGraceUntil:
          description: End of the predecessor's grace window.
          format: date-time
          type: string
        scopes:
          description: Granted permissions.
          items:
            type: string
          type:
            - array
            - "null"
        updatedAt:
          description: Last metadata update.
          format: date-time
          type: string
        userId:
          description: Owning member id.
          type: string
      required:
        - key
        - id
        - userId
        - name
        - prefix
        - scopes
        - expiresAt
        - createdAt
        - updatedAt
      type: object
    DataExportResponse:
      additionalProperties: false
      properties:
        contentUrl:
          type: string
        createdAt:
          format: date-time
          type: string
        expiresAt:
          format: date-time
          type: string
        id:
          type: string
        status:
          enum:
            - queued
            - running
            - ready
            - failed
            - expired
          type: string
        tenantId:
          type: string
        updatedAt:
          format: date-time
          type: string
        userId:
          type: string
      required:
        - id
        - tenantId
        - userId
        - status
        - createdAt
        - updatedAt
      type: object
    ErasureRequest:
