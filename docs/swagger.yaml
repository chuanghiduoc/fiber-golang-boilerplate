basePath: /api/v1
definitions:
  admindto.AdminStatsResponse:
    properties:
      activeUsers:
        type: integer
      deletedUsers:
        type: integer
      totalFileSize:
        type: integer
      totalFiles:
        type: integer
    type: object
  admindto.FileResponse:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      id:
        type: integer
      mimeType:
        type: string
      originalName:
        type: string
      size:
        type: integer
      url:
        type: string
      userId:
        type: integer
    type: object
  admindto.UpdateRoleRequest:
    properties:
      role:
        enum:
        - user
        - admin
        type: string
    required:
    - role
    type: object
  admindto.UserResponse:
    properties:
      bannedAt:
        type: string
      createdAt:
        type: string
      deletedAt:
        type: string
      email:
        type: string
      emailVerified:
        type: boolean
      hasPassword:
        type: boolean
      id:
        type: integer
      name:
        type: string
      role:
        type: string
      updatedAt:
        type: string
    type: object
  apperror.FieldError:
    properties:
      code:
        type: string
      message:
        type: string
      path:
        type: string
    type: object
  apperror.ProblemDetails:
    properties:
      code:
        type: string
      detail:
        type: string
      errors:
        items:
          $ref: '#/definitions/apperror.FieldError'
        type: array
      instance:
        type: string
      requestId:
        type: string
      status:
        type: integer
      timestamp:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  dto.ChangePasswordRequest:
    properties:
      currentPassword:
        type: string
      newPassword:
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  dto.CreateEndpointRequest:
    properties:
      description:
        maxLength: 255
        type: string
      eventTypes:
        items:
          type: string
        maxItems: 20
        type: array
      maxAttempts:
        maximum: 50
        minimum: 1
        type: integer
      timeoutMs:
        maximum: 120000
        minimum: 100
        type: integer
      url:
        maxLength: 2048
        type: string
    required:
    - url
    type: object
  dto.CreateInboundSourceRequest:
    properties:
      name:
        maxLength: 255
        type: string
      slug:
        maxLength: 63
        minLength: 1
        type: string
    required:
    - name
    - slug
    type: object
  dto.DeliveryAttemptResponse:
    properties:
      attempt:
        type: integer
      createdAt:
        type: string
      deliveryId:
        type: integer
      durationMs:
        type: integer
      error:
        type: string
      id:
        type: integer
      statusCode:
        type: integer
    type: object
  dto.DeliveryResponse:
    properties:
      attempts:
        type: integer
      createdAt:
        type: string
      deliveredAt:
        type: string
      endpointId:
        type: integer
      eventId:
        type: string
      eventType:
        type: string
      id:
        type: integer
      lastError:
        type: string
      lastStatusCode:
        type: integer
      maxAttempts:
        type: integer
      nextAttemptAt:
        type: string
      payload:
        type: object
      replayedFromId:
        type: integer
      status:
        type: string
      tenantId:
        type: integer
      updatedAt:
        type: string
    type: object
  dto.EndpointResponse:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      description:
        type: string
      eventTypes:
        items:
          type: string
        type: array
      id:
        type: integer
      maxAttempts:
        type: integer
      status:
        type: string
      tenantId:
        type: integer
      timeoutMs:
        type: integer
      updatedAt:
        type: string
      url:
        type: string
    type: object
  dto.EndpointSecretResponse:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      description:
        type: string
      eventTypes:
        items:
          type: string
        type: array
      id:
        type: integer
      maxAttempts:
        type: integer
      secret:
        type: string
      status:
        type: string
      tenantId:
        type: integer
      timeoutMs:
        type: integer
      updatedAt:
        type: string
      url:
        type: string
    type: object
  dto.FileResponse:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      id:
        type: integer
      mimeType:
        type: string
      originalName:
        type: string
      size:
        type: integer
      tenantId:
        type: integer
      url:
        type: string
      userId:
        type: integer
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        maxLength: 255
        type: string
    required:
    - email
    type: object
  dto.InboundEventResponse:
    properties:
      duplicate:
        type: boolean
      eventId:
        type: string
      eventType:
        type: string
      id:
        type: integer
      payload:
        type: object
      receivedAt:
        type: string
      sourceId:
        type: integer
      tenantId:
        type: integer
    type: object
  dto.InboundReceipt:
    properties:
      duplicate:
        type: boolean
      eventId:
        type: string
      eventType:
        type: string
      id:
        type: integer
      receivedAt:
        type: string
      sourceId:
        type: integer
      tenantId:
        type: integer
    type: object
  dto.InboundSourceResponse:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      id:
        type: integer
      name:
        type: string
      receiverUrl:
        type: string
      slug:
        type: string
      status:
        type: string
      tenantId:
        type: integer
      updatedAt:
        type: string
    type: object
  dto.InboundSourceSecretResponse:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      id:
        type: integer
      name:
        type: string
      receiverUrl:
        type: string
      secret:
        type: string
      slug:
        type: string
      status:
        type: string
      tenantId:
        type: integer
      updatedAt:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.RefreshRequest:
    properties:
      refreshToken:
        maxLength: 256
        type: string
    required:
    - refreshToken
    type: object
  dto.RegisterRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
      password:
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.ResendVerificationRequest:
    properties:
      email:
        maxLength: 255
        type: string
    required:
    - email
    type: object
  dto.ResetPasswordRequest:
    properties:
      password:
        type: string
      token:
        maxLength: 256
        type: string
    required:
    - password
    - token
    type: object
  dto.UpdateEndpointRequest:
    properties:
      description:
        maxLength: 255
        type: string
      eventTypes:
        items:
          type: string
        maxItems: 20
        type: array
      maxAttempts:
        maximum: 50
        minimum: 1
        type: integer
      status:
        enum:
        - active
        - disabled
        type: string
      timeoutMs:
        maximum: 120000
        minimum: 100
        type: integer
      url:
        maxLength: 2048
        type: string
    required:
    - status
    - url
    type: object
  dto.UpdateInboundSourceRequest:
    properties:
      name:
        maxLength: 255
        type: string
      slug:
        maxLength: 63
        minLength: 1
        type: string
      status:
        enum:
        - active
        - disabled
        type: string
    required:
    - name
    - slug
    - status
    type: object
  dto.UpdateUserRequest:
    properties:
      currentPassword:
        description: CurrentPassword is required when a non-admin changes their own
          email.
        type: string
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
    type: object
  dto.UserResponse:
    properties:
      bannedAt:
        type: string
      createdAt:
        type: string
      deletedAt:
        type: string
      email:
        type: string
      emailVerified:
        type: boolean
      hasPassword:
        type: boolean
      id:
        type: integer
      name:
        type: string
      role:
        type: string
      tenantId:
        description: TenantID identifies the owning tenant. It is additive and read-only.
        type: integer
      updatedAt:
        type: string
    type: object
  dto.VerifyEmailRequest:
    properties:
      token:
        maxLength: 256
        type: string
    required:
    - token
    type: object
  response.ListResponse:
    properties:
      data: {}
      hasMore:
        type: boolean
      nextCursor:
        type: string
      object:
        type: string
      url:
        type: string
    type: object
info:
  contact: {}
  description: REST API boilerplate built with Go Fiber v3, PostgreSQL, and sqlc.
  title: Fiber Golang Boilerplate API
  version: "1.0"
paths:
  /admin/files:
    get:
      description: Get a paginated list of all files
      parameters:
      - default: 20
        description: Max items to return
        in: query
        name: limit
        type: integer
      - description: Cursor from the last item of the previous page
        in: query
        name: startingAfter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ListResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/admindto.FileResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      security:
      - BearerAuth: []
      summary: List all files (admin)
      tags:
      - Admin
  /admin/files/{id}:
    delete:
      description: Soft-delete a file by ID regardless of owner
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Soft-delete any file (admin)
      tags:
      - Admin
  /admin/files/{id}/download:
    get:
      description: Download an active file by ID
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Download any file (admin)
      tags:
      - Admin
  /admin/files/{id}/restore:
    post:
      description: Restore any file by ID
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admindto.FileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Restore a soft-deleted file (admin)
      tags:
      - Admin
  /admin/stats:
    get:
      description: Get system-wide statistics (admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admindto.AdminStatsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Get system statistics
      tags:
      - Admin
  /admin/users:
    get:
      description: Get a paginated list of all users including soft-deleted
      parameters:
      - default: 20
        description: Max items to return
        in: query
        name: limit
        type: integer
      - description: Cursor from the last item of the previous page
        in: query
        name: startingAfter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ListResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/admindto.UserResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      security:
      - BearerAuth: []
      summary: List all users (admin)
      tags:
      - Admin
  /admin/users/{id}/ban:
    post:
      description: Soft delete a user (admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Ban a user
      tags:
      - Admin
  /admin/users/{id}/role:
    put:
      consumes:
      - application/json
      description: Update a user's role (admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Role update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admindto.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admindto.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Update user role
      tags:
      - Admin
  /admin/users/{id}/unban:
    post:
      description: Restore a soft-deleted user (admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admindto.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Unban a user
      tags:
      - Admin
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Send a password reset email
      parameters:
      - description: Forgot password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      summary: Request password reset
      tags:
      - Auth
  /auth/google:
    get:
      description: Redirects the user to Google's OAuth consent screen
      responses:
        "302":
          description: Found
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      summary: Redirect to Google OAuth
      tags:
      - Auth
  /auth/google/callback:
    get:
      description: Handles the callback from Google OAuth, creates/finds user and
        redirects with tokens
      parameters:
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      summary: Google OAuth callback
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access + refresh tokens
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke a refresh token
      parameters:
      - description: Refresh token to revoke
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      summary: Logout
      tags:
      - Auth
  /auth/logout-all:
    post:
      description: Revoke every refresh token for the authenticated user
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Revoke all refresh tokens
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a refresh token for a new access token
      parameters:
      - description: Refresh request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      summary: Refresh access token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.ProblemDetails'
      summary: Register a new user
      tags:
      - Auth
  /auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Resend email verification link
      parameters:
      - description: Resend verification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResendVerificationRequest'
