name: Scorecard

# OpenSSF Scorecard: supply-chain hygiene checks (pinned actions, branch
# protection, dangerous workflow patterns, token permissions, signed releases).
# Runs weekly and on default-branch pushes; results land in the Security tab as
# SARIF. `publish_results` is off so a private fork is not asked to publish to
# the public Scorecard API; enable it when the repository is public.
on:
  branch_protection_rule:
  schedule:
    - cron: "37 3 * * 1"
  push:
    branches: [main, master]

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload the SARIF result to code scanning.
      security-events: write
      # Needed only when publish_results publishes the score to the OpenSSF API.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif

      - name: Upload results artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
          if-no-files-found: error
