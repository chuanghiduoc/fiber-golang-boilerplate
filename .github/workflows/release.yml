name: Release

# Actions are pinned to full commit SHAs; the trailing comment records the
# verified release tag (resolved with `gh api repos/<owner>/<repo>/commits/<tag>`
# and every new release at least 14 days old as of 2026-10-26).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Read-only at workflow level; only the publish job may write packages and
# attestations.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Keyless cosign identity deploy.yml accepts (issuer and the staging/broad ref
  # pattern). Workflows cannot share env, so these values are duplicated in
  # deploy.yml; keep them byte-identical. The verify step below rejects a
  # signature deploy would refuse before the release finishes.
  COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
  COSIGN_IDENTITY_REF_PATTERN: refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?

jobs:
  # Build/test gate: never publish an image unless the module builds and the
  # race-enabled test suite passes at the tagged commit.
  test:
    name: Test gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  publish:
    name: Build, scan, and publish multi-arch image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing: the workflow's OIDC identity is the signer.
      id-token: write
      # GitHub artifact attestations (build provenance and SBOM).
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag ancestry check needs the full history, including origin/main.
          fetch-depth: 0
          persist-credentials: false

      # Only a v<semver> tag may publish. A manual dispatch from a branch (or a
      # non-semver tag) would sign an image whose identity deploy.yml refuses
      # anyway; failing here says why instead of publishing something unusable.
      - name: Verify release ref
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::Release publishes only from a v<semver> tag ref (got '$GITHUB_REF'). Push a tag or dispatch this workflow on a tag."
              exit 1
              ;;
          esac
          tag="${GITHUB_REF#refs/tags/}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag '$tag' is not v<major>.<minor>.<patch>[-prerelease][+build]"
            exit 1
          fi
          # A release is only valid when its commit is already on main. This
          # prevents tagging a side branch or an unmerged commit and publishing
          # an image that no reviewed main commit produced. Peel an annotated
          # tag to its commit (GITHUB_SHA may be the tag object). Protect v*
          # tags with a tag ruleset (see deploy/k8s/README.md#release-tags-and-supply-chain).
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null; then
            echo "::error::origin/main is not available in this checkout; cannot verify that $tag_commit is on main"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::tag $tag points at $tag_commit, which is not an ancestor of origin/main; merge it first"
            exit 1
          fi
          echo "Publishing $tag ($tag_commit is on main)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Stable tag pushes produce semver tags (1.4.2, 1.4, 1) and latest;
          # metadata-action's default latest=auto skips pre-releases, which
          # keep only their full version tag. Every run also gets a full-SHA
          # tag. Branch refs are rejected above, so no branch tag is produced.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=fiber-golang-boilerplate
            org.opencontainers.image.description=Production-minded Go Fiber SaaS API
            org.opencontainers.image.licenses=MIT

      # Push the exact image that will be deployed BEFORE scanning it, so the
      # scan and the signature cover the pushed artifact rather than a local
      # rebuild. Nothing is signed yet: a failed scan leaves the image unsigned
      # and deploy.yml refuses unsigned images.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Embedded in cmd/api and logged at startup (build info). The image
          # tag alone is not trusted at runtime.
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Resolve the pushed index to its per-platform manifests. Each platform is
      # scanned by its own digest, because the packages differ per
      # architecture; the index digest is what gets signed below.
      - name: Resolve per-platform digests
        id: digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::unexpected pushed digest '$DIGEST'"
            exit 1
          fi
          index="$(docker buildx imagetools inspect "$image@$DIGEST" --raw)"
          amd64="$(printf '%s' "$index" | jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else "" end')"
          arm64="$(printf '%s' "$index" | jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | if length == 1 then .[0].digest else "" end')"
          for platform in amd64 arm64; do
            eval "digest=\${$platform}"
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::error::could not resolve exactly one linux/$platform image from $image@$DIGEST"
              printf '%s' "$index" | jq -r '.manifests[] | "\(.platform.os // "unknown")/\(.platform.architecture // "unknown") \(.digest)"'
              exit 1
            fi
          done
          {
            echo "image=$image"
            echo "amd64=$amd64"
            echo "arm64=$arm64"
          } >> "$GITHUB_OUTPUT"

      - name: Scan linux/amd64 image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digests.outputs.image }}@${{ steps.digests.outputs.amd64 }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
        env:
          # The pushed GHCR package may be private; Trivy authenticates with the
          # same workflow token used for the push.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan linux/arm64 image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digests.outputs.image }}@${{ steps.digests.outputs.arm64 }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # Generate one SBOM per platform image (syft cannot describe a
      # multi-platform index). Each is attested against its own digest below,
      # in addition to the buildx SBOM attestation attached at push time.
      - name: Generate SBOM (linux/amd64)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.digests.outputs.image }}@${{ steps.digests.outputs.amd64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-amd64.spdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (linux/arm64)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.digests.outputs.image }}@${{ steps.digests.outputs.arm64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-arm64.spdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Sign the scanned index digest (never a mutable tag) with the workflow's
      # keyless identity. deploy.yml verifies this identity before rollout.
      # Provenance and SBOM attestations were attached by the build push above.
      - name: Sign image
        env:
          IMAGE: ${{ steps.digests.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$DIGEST"

      # GitHub artifact attestations (SLSA v1.0 Build L2+). Unlike the buildx
      # provenance attached at push time, these are signed with the workflow's
      # OIDC identity and recorded in the repository's attestation store, which
      # is what deploy.yml verifies with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.digests.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # One SBOM attestation per platform digest, matching the generated SPDX
      # documents. The deployed reference is the index; consumers resolve the
      # platform digest they actually run.
      - name: Attest SBOM (linux/amd64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.digests.outputs.image }}
          subject-digest: ${{ steps.digests.outputs.amd64 }}
          sbom-path: ${{ runner.temp }}/sbom-amd64.spdx.json
          push-to-registry: true

      - name: Attest SBOM (linux/arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.digests.outputs.image }}
          subject-digest: ${{ steps.digests.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/sbom-arm64.spdx.json
          push-to-registry: true

      # Prove the attestations are verifiable by the same identity deploy.yml
      # requires, so a release the deploy would refuse fails here.
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.digests.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          AMD64: ${{ steps.digests.outputs.amd64 }}
          ARM64: ${{ steps.digests.outputs.arm64 }}
        run: |
          set -euo pipefail
          workflow="${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$workflow" \
            --predicate-type https://slsa.dev/provenance/v1 > /dev/null
          for digest in "$AMD64" "$ARM64"; do
            gh attestation verify "oci://${IMAGE}@${digest}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$workflow" \
              --predicate-type https://spdx.dev/Document > /dev/null
          done
          echo "Provenance and SBOM attestations verified for $IMAGE@$DIGEST"

      # Deploy rejects an image whose signature is not from this repository's
      # release.yml on a v<semver> tag. Verify the digest we just signed with
      # that identity (the shared issuer and identity regexp deploy.yml keeps in
      # its workflow-level env) so a release whose signature the deploy would
      # refuse fails here instead of at rollout.
      - name: Verify signed digest
        env:
          IMAGE: ${{ steps.digests.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::unexpected signed digest '$DIGEST'"
            exit 1
          fi
          repo_regexp="$(printf '%s' "$GITHUB_REPOSITORY" | sed 's/\./\\./g')"
          certificate_identity_regexp="$(printf '^https://github\\.com/%s/\\.github/workflows/release\\.yml@%s$' \
            "$repo_regexp" "$COSIGN_IDENTITY_REF_PATTERN")"
          cosign verify \
            --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
            --certificate-identity-regexp "$certificate_identity_regexp" \
            "$IMAGE@$DIGEST" > /dev/null
          echo "Signature verified for $IMAGE@$DIGEST"
