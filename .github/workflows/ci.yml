name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^docs/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::Files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Check Swagger docs are up to date
        run: |
          swag init -g cmd/api/main.go -o docs
          git add -N docs/
          git diff --exit-code docs/ || (echo "Swagger docs are outdated. Run 'make swagger' and commit." && exit 1)

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Check sqlc generated code is up to date
        run: |
          sqlc generate
          git add -N internal/modules/identity/sqlc/ internal/modules/files/sqlc/
          git diff --exit-code internal/modules/identity/sqlc/ internal/modules/files/sqlc/ || (echo "sqlc code is outdated. Run 'make sqlc-generate' and commit." && exit 1)

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o server ./cmd/api

      - name: Build migrate binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o migrate ./cmd/migrate

  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          curl -fsSLo actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz
          sudo mv actionlint /usr/local/bin/actionlint
          rm actionlint.tar.gz

      - name: Lint workflows
        run: actionlint

      - name: Install kustomize
        run: |
          curl -fsSLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/kustomize
          rm kustomize.tar.gz

      - name: Render app manifests
        run: kustomize build deploy/k8s > /tmp/app-manifests.yaml

      - name: Check excluded resources
        run: |
          if grep -qx 'kind: Secret' /tmp/app-manifests.yaml; then
            echo "::error::secret.example.yaml must not be part of the app kustomization"
            exit 1
          fi
          if grep -q 'name: fiber-boilerplate-migrate' /tmp/app-manifests.yaml; then
            echo "::error::migration-job.yaml must be applied separately, not via the app kustomization"
            exit 1
          fi

      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform
          rm kubeconform.tar.gz

      - name: Validate manifests
        run: |
          kubeconform -strict -summary -kubernetes-version 1.29.0 \
            /tmp/app-manifests.yaml \
            deploy/k8s/migration-job.yaml \
            deploy/k8s/secret.example.yaml

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: boilerplate
          POSTGRES_USER: postgres
          # Ephemeral CI-only database; no password is used or stored.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d boilerplate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: boilerplate
      DB_USERNAME: postgres
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Apply initial schema up and down with psql
        run: |
          psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
            -f migrations/000001_init_schema.up.sql

          expected_tables="users refresh_tokens password_reset_tokens email_verification_tokens files jobs audit_events"
          existing_tables=$(psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -tAc \
            "SELECT tablename FROM pg_tables WHERE schemaname = 'public'")
          for table in $expected_tables; do
            if ! grep -qx "$table" <<< "$existing_tables"; then
              echo "::error::missing table after up migration: $table"
              exit 1
            fi
          done

          psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
            -f migrations/000001_init_schema.down.sql

          remaining_tables=$(psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -tAc \
            "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'")
          if [ "$remaining_tables" -ne 0 ]; then
            echo "::error::down migration left $remaining_tables table(s) behind"
            exit 1
          fi

      - name: Run cmd/migrate twice against a clean database
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate

          migrated_tables=$(psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -tAc \
            "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tablename IN ('users', 'refresh_tokens', 'password_reset_tokens', 'email_verification_tokens', 'files', 'jobs', 'audit_events')")
          if [ "$migrated_tables" -ne 7 ]; then
            echo "::error::expected 7 tables after cmd/migrate, found $migrated_tables"
            exit 1
          fi

      - name: Reject a legacy version-1 schema with an actionable error
        run: |
          psql -h "$DB_HOST" -U "$DB_USERNAME" -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE legacy"
          psql -h "$DB_HOST" -U "$DB_USERNAME" -d legacy -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE users (id BIGSERIAL PRIMARY KEY); \
                CREATE TABLE schema_migrations (version BIGINT NOT NULL, dirty BOOLEAN NOT NULL); \
                INSERT INTO schema_migrations VALUES (1, false);"
          if DB_DATABASE=legacy go run ./cmd/migrate > /tmp/legacy-migrate.log 2>&1; then
            echo "::error::legacy schema unexpectedly passed migration verification"
            exit 1
          fi
          grep -q "schema is incomplete" /tmp/legacy-migrate.log || {
            echo "::error::legacy schema failed without the expected actionable error"
            cat /tmp/legacy-migrate.log
            exit 1
          }

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        run: govulncheck ./...

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: docker build -t fiber-golang-boilerplate:ci .

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Show coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: apptest
          POSTGRES_USER: postgres
          # Ephemeral CI-only database; no password is used or stored.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/apptest?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The audit integration tests query the public schema directly; the
      # handler/jobs tests create their own isolated schemas from the same file.
      - name: Apply schema to integration database
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000001_init_schema.up.sql

      - name: Run integration tests (PostgreSQL service)
        run: go test -tags=integration -race -count=1 -timeout=10m ./...
