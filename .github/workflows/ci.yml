name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^docs/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::Files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Check OpenAPI spec is up to date
        run: |
          go run ./cmd/openapi
          git add -N docs/openapi.yaml
          git diff --exit-code docs/openapi.yaml || (echo "OpenAPI spec is outdated. Run 'make openapi' and commit." && exit 1)

      - name: Check sqlc generated code is up to date
        run: |
          # Each module owns internal/modules/<name>/sqlc.yaml. A module with
          # queries/ but no config would silently skip generation, so fail.
          shopt -s nullglob
          for queries in internal/modules/*/queries; do
            module_dir=$(dirname "$queries")
            if [ ! -f "$module_dir/sqlc.yaml" ]; then
              echo "::error::$module_dir has queries/ but no sqlc.yaml" && exit 1
            fi
          done
          configs=(internal/modules/*/sqlc.yaml)
          if [ "${#configs[@]}" -eq 0 ]; then
            echo "::error::no internal/modules/*/sqlc.yaml found" && exit 1
          fi
          for config in "${configs[@]}"; do
            echo "sqlc generate -f $config"
            go tool sqlc generate -f "$config"
          done
          git add -N internal/modules/*/sqlc/
          git diff --exit-code internal/modules/*/sqlc/ || (echo "sqlc code is outdated. Run 'make sqlc-generate' and commit." && exit 1)

  # cmd/openapi emits the same OpenAPI 3.1 document the server serves, so base
  # and PR specs are compared directly and oasdiff fails on ERR-level breaking
  # changes. An intentional break is acknowledged by editing
  # docs/api-breaking-changes.md in the same PR; the report is then printed but
  # does not fail. The Lint job already proves the committed spec is current.
  api-compat:
    name: API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Detect breaking API changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF}"
          if ! git cat-file -e "${base}:docs/openapi.yaml" 2>/dev/null; then
            echo "::notice::${base} has no docs/openapi.yaml; nothing to compare"
            exit 0
          fi
          git show "${base}:docs/openapi.yaml" > /tmp/base-openapi.yaml
          cp docs/openapi.yaml /tmp/pr-openapi.yaml

          if git diff --name-only "${base}...HEAD" | grep -qx 'docs/api-breaking-changes.md'; then
            echo "::warning::docs/api-breaking-changes.md changed: breaking changes are reported, not enforced"
            go tool oasdiff breaking /tmp/base-openapi.yaml /tmp/pr-openapi.yaml --format githubactions
            go tool oasdiff breaking /tmp/base-openapi.yaml /tmp/pr-openapi.yaml
            exit 0
          fi
          go tool oasdiff breaking /tmp/base-openapi.yaml /tmp/pr-openapi.yaml --format githubactions
          go tool oasdiff breaking /tmp/base-openapi.yaml /tmp/pr-openapi.yaml --fail-on ERR || {
            echo "::error::Breaking API change against ${base}. If intentional, record it in docs/api-breaking-changes.md in this PR."
            exit 1
          }

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o server ./cmd/api

      - name: Build migrate binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o migrate ./cmd/migrate

      - name: Build seed binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o seed ./cmd/seed

  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          release_url=https://github.com/rhysd/actionlint/releases/download/v1.7.12
          curl -fsSLo "$archive" "$release_url/$archive"
          curl -fsSLo actionlint_checksums.txt "$release_url/actionlint_1.7.12_checksums.txt"
          expected="$(awk -v file="$archive" '$2 == file {print $1}' actionlint_checksums.txt)"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::actionlint checksum mismatch (expected '${expected}', got '${actual}')"
            exit 1
          fi
          tar -xzf "$archive"
          sudo mv actionlint /usr/local/bin/actionlint
          rm "$archive" actionlint_checksums.txt

      - name: Lint workflows
        run: actionlint

      - name: Install kustomize
        run: |
          set -euo pipefail
          archive=kustomize_v5.8.1_linux_amd64.tar.gz
          release_url=https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1
          curl -fsSLo "$archive" "$release_url/$archive"
          curl -fsSLo kustomize_checksums.txt "$release_url/checksums.txt"
          expected="$(awk -v file="$archive" '$2 == file {print $1}' kustomize_checksums.txt)"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::kustomize checksum mismatch (expected '${expected}', got '${actual}')"
            exit 1
          fi
          tar -xzf "$archive"
          sudo mv kustomize /usr/local/bin/kustomize
          rm "$archive" kustomize_checksums.txt

      - name: Render app manifests
        run: |
          set -euo pipefail
          kustomize build deploy/k8s > /tmp/app-manifests.yaml
          for env in staging production; do
            kustomize build "deploy/k8s/overlays/$env" > "/tmp/${env}-manifests.yaml"
            kustomize build "deploy/k8s/overlays/$env/prereqs" > "/tmp/${env}-prereqs.yaml"
            kustomize build "deploy/k8s/overlays/$env/migration" > "/tmp/${env}-migration.yaml"
            kustomize build "deploy/k8s/overlays/$env/seed" > "/tmp/${env}-seed.yaml"
          done
          # Optional components cannot be built alone; their examples prove
          # they compose with the base.
          for example in image-policy external-secrets keda-worker-scaler; do
            kustomize build "deploy/k8s/examples/$example" > "/tmp/component-${example}.yaml"
          done

      - name: Check the api/worker split
        run: |
          set -euo pipefail
          for file in /tmp/app-manifests.yaml /tmp/staging-manifests.yaml /tmp/production-manifests.yaml; do
            if grep -qE '^[[:space:]]+value: all$' "$file"; then
              echo "::error::APP_ROLE=all must not appear in Kubernetes manifests ($file); the defaults split api and worker"
              exit 1
            fi
            for role in api worker; do
              if ! grep -qE "^[[:space:]]+value: ${role}$" "$file"; then
                echo "::error::$file has no APP_ROLE=${role} workload"
                exit 1
              fi
            done
          done

      - name: Check excluded resources
        run: |
          for file in /tmp/app-manifests.yaml /tmp/staging-manifests.yaml /tmp/production-manifests.yaml; do
            if grep -qx 'kind: Secret' "$file"; then
              echo "::error::secret.example.yaml must not be part of an app kustomization ($file)"
              exit 1
            fi
            if grep -q 'name: fiber-boilerplate-migrate' "$file"; then
              echo "::error::migration/job.yaml must be applied separately, not via an app kustomization ($file)"
              exit 1
            fi
            if grep -q 'name: fiber-boilerplate-seed' "$file"; then
              echo "::error::seed/job.yaml must be applied separately, not via an app kustomization ($file)"
              exit 1
            fi
          done

      - name: Check overlay namespaces
        run: |
          set -euo pipefail
          for env in staging production; do
            ns="fiber-boilerplate-${env}"
            for file in "/tmp/${env}-manifests.yaml" "/tmp/${env}-prereqs.yaml"; do
              if ! grep -qE "^  name: ${ns}$" "$file"; then
                echo "::error::Namespace object was not renamed to $ns in $file"
                exit 1
              fi
            done
            for file in \
              "/tmp/${env}-manifests.yaml" \
              "/tmp/${env}-prereqs.yaml" \
              "/tmp/${env}-migration.yaml" \
              "/tmp/${env}-seed.yaml"; do
              if grep -qE '^  namespace: fiber-boilerplate$' "$file"; then
                echo "::error::$file still contains base-namespace resources"
                exit 1
              fi
              if ! grep -qE "^  namespace: ${ns}$" "$file"; then
                echo "::error::$file has no resource in namespace $ns"
                exit 1
              fi
            done
          done

      - name: Install kubeconform
        run: |
          set -euo pipefail
          archive=kubeconform-linux-amd64.tar.gz
          release_url=https://github.com/yannh/kubeconform/releases/download/v0.8.0
          curl -fsSLo "$archive" "$release_url/$archive"
          curl -fsSLo kubeconform_CHECKSUMS "$release_url/CHECKSUMS"
          expected="$(awk -v file="$archive" '$2 == file {print $1}' kubeconform_CHECKSUMS)"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::kubeconform checksum mismatch (expected '${expected}', got '${actual}')"
            exit 1
          fi
          tar -xzf "$archive"
          sudo mv kubeconform /usr/local/bin/kubeconform
          rm "$archive" kubeconform_CHECKSUMS

      - name: Validate manifests
        run: |
          # kubeconform validates CRDs through the Datree CRDs catalog: the
          # optional components use ExternalSecret (external-secrets.io),
          # ClusterImagePolicy (policy.sigstore.dev), and ScaledObject (keda.sh).
          kubeconform -strict -summary -kubernetes-version 1.32.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/app-manifests.yaml \
            /tmp/staging-manifests.yaml \
            /tmp/production-manifests.yaml \
            /tmp/staging-prereqs.yaml \
            /tmp/production-prereqs.yaml \
            /tmp/staging-migration.yaml \
            /tmp/production-migration.yaml \
            /tmp/staging-seed.yaml \
            /tmp/production-seed.yaml \
            /tmp/component-image-policy.yaml \
            /tmp/component-external-secrets.yaml \
            /tmp/component-keda-worker-scaler.yaml \
            deploy/k8s/migration/job.yaml \
            deploy/k8s/seed/job.yaml \
            deploy/k8s/secret.example.yaml \
            deploy/k8s/migrate-secret.example.yaml \
            deploy/k8s/seed-secret.example.yaml \
            deploy/k8s/rbac/deployer-role.yaml \
            deploy/k8s/rbac/namespace-bootstrap-clusterrole.yaml

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_DB: boilerplate
          POSTGRES_USER: postgres
          # Ephemeral CI-only database; no password is used or stored.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d boilerplate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: boilerplate
      DB_USERNAME: postgres
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Apply every up file in version order (the init, then later
      # migrations), every down file in reverse, then up again, so each down
      # drops exactly what its up created.
      - name: Apply migrations up, down, and up again with psql
        run: |
          expected_tables="tenants users refresh_tokens password_reset_tokens email_verification_tokens api_keys api_key_scopes files feature_flags feature_flag_targets notifications notification_preferences jobs scheduler_leases scheduler_runs audit_events webhook_endpoints webhook_endpoint_subscriptions webhook_endpoint_secrets webhook_events webhook_deliveries webhook_delivery_attempts webhook_inbound_sources webhook_inbound_events"
          apply() {
            for file in "$@"; do
              echo "applying $file"
              psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -q -f "$file"
            done
          }
          check_tables() {
            existing_tables=$(psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -tAc \
              "SELECT tablename FROM pg_tables WHERE schemaname = 'public'")
            for table in $expected_tables; do
              if ! grep -qx "$table" <<< "$existing_tables"; then
                echo "::error::missing table after up migrations: $table"
                exit 1
              fi
            done
          }
          mapfile -t up_files < <(find migrations -maxdepth 1 -name '*.up.sql' | sort)
          mapfile -t down_files < <(find migrations -maxdepth 1 -name '*.down.sql' | sort -r)
          if [ "${#up_files[@]}" -eq 0 ] || [ "${#up_files[@]}" -ne "${#down_files[@]}" ]; then
            echo "::error::expected matching up/down migrations, found ${#up_files[@]} up and ${#down_files[@]} down"
            exit 1
          fi

          apply "${up_files[@]}"
          check_tables

          apply "${down_files[@]}"
          remaining=$(psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -tAc \
            "SELECT (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public')
                  + (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public')")
          if [ "$remaining" -ne 0 ]; then
            echo "::error::down migrations left $remaining relation(s)/function(s) behind"
            exit 1
          fi

          apply "${up_files[@]}"
          check_tables
          apply "${down_files[@]}"

      - name: Run cmd/migrate twice against a clean database
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate

          migrated_tables=$(psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -tAc \
            "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tablename IN ('tenants', 'users', 'refresh_tokens', 'password_reset_tokens', 'email_verification_tokens', 'api_keys', 'api_key_scopes', 'files', 'feature_flags', 'feature_flag_targets', 'notifications', 'notification_preferences', 'jobs', 'scheduler_leases', 'scheduler_runs', 'audit_events', 'webhook_endpoints', 'webhook_endpoint_subscriptions', 'webhook_endpoint_secrets', 'webhook_events', 'webhook_deliveries', 'webhook_delivery_attempts', 'webhook_inbound_sources', 'webhook_inbound_events')")
          if [ "$migrated_tables" -ne 24 ]; then
            echo "::error::expected 24 tables after cmd/migrate, found $migrated_tables"
            exit 1
          fi

      - name: Create the non-superuser app role and verify RLS
        run: |
          psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
            -v app_user=app -v app_password=app \
            -v bypass_user=app_bypass -v bypass_password=app_bypass \
            -v owner="$DB_USERNAME" -v schema=public \
            -f deploy/postgres/database-roles.sql
          unsafe=$(psql -h "$DB_HOST" -U app -d "$DB_DATABASE" -tAc \
            "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = current_user")
          if [ "$unsafe" != "f" ]; then
            echo "::error::the app role must be a non-superuser without BYPASSRLS"
            exit 1
          fi
          bypass_state=$(psql -h "$DB_HOST" -U app_bypass -d "$DB_DATABASE" -tAc \
            "SELECT rolbypassrls AND NOT rolsuper FROM pg_roles WHERE rolname = current_user")
          if [ "$bypass_state" != "t" ]; then
            echo "::error::the bypass role must be a non-superuser with BYPASSRLS"
            exit 1
          fi
          bypass_owns=$(psql -h "$DB_HOST" -U app_bypass -d "$DB_DATABASE" -tAc \
            "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'public' AND c.relowner = (SELECT oid FROM pg_roles WHERE rolname = current_user)")
          if [ "$bypass_owns" -ne 0 ]; then
            echo "::error::the bypass role must own no tables"
            exit 1
          fi
          member=$(psql -h "$DB_HOST" -U app -d "$DB_DATABASE" -tAc \
            "SELECT pg_has_role(current_user, 'app_bypass', 'MEMBER')")
          if [ "$member" != "f" ]; then
            echo "::error::the app role must not be a member of the bypass role"
            exit 1
          fi
          # Every table with a tenant_id column must have ENABLE + FORCE row
          # level security, and every table with forced RLS must have a
          # tenant_id column. Both sets come from the schema, not a literal, so
          # adding a correct tenant-owned module does not turn CI red.
          missing_rls=$(psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -tAc \
            "SELECT t.tablename FROM pg_tables t
             JOIN pg_class c ON c.relname = t.tablename
             JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = t.schemaname
             WHERE t.schemaname = 'public'
               AND EXISTS (SELECT 1 FROM information_schema.columns col
                           WHERE col.table_schema = t.schemaname
                             AND col.table_name = t.tablename
                             AND col.column_name = 'tenant_id')
               AND NOT (c.relrowsecurity AND c.relforcerowsecurity)
             ORDER BY t.tablename")
          if [ -n "$missing_rls" ]; then
            echo "::error::every table with a tenant_id column must have ENABLE + FORCE row level security:"
            echo "$missing_rls"
            exit 1
          fi
          extra_rls=$(psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -tAc \
            "SELECT c.relname FROM pg_class c
             JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'public' AND c.relkind IN ('r', 'p')
               AND c.relrowsecurity AND c.relforcerowsecurity
               AND NOT EXISTS (SELECT 1 FROM information_schema.columns col
                               WHERE col.table_schema = n.nspname
                                 AND col.table_name = c.relname
                                 AND col.column_name = 'tenant_id')
             ORDER BY c.relname")
          if [ -n "$extra_rls" ]; then
            echo "::error::a table without a tenant_id column must not use FORCE row level security:"
            echo "$extra_rls"
            exit 1
          fi

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: go tool govulncheck ./...

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --build-arg VERSION=ci -t fiber-golang-boilerplate:ci .

      - name: Verify the image health check subcommand
        run: docker run --rm fiber-golang-boilerplate:ci /app/server healthcheck --help

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Show coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_DB: apptest
          POSTGRES_USER: postgres
          # Ephemeral CI-only database; no password is used or stored.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/apptest?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The audit integration tests query the public schema directly; the
      # handler/jobs tests create their own isolated schemas from the same files.
      - name: Apply schema to integration database
        run: |
          for file in $(find migrations -maxdepth 1 -name '*.up.sql' | sort); do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file"
          done

      - name: Run integration tests (PostgreSQL service)
        run: go test -tags=integration -race -count=1 -timeout=10m ./...
