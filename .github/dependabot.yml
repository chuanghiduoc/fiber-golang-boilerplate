version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # Supply-chain cooldown: only propose releases at least 14 days old, so a
    # yanked or compromised version is usually caught before it lands here.
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
    open-pull-requests-limit: 15
    # Modules released together are upgraded together so a PR never mixes
    # versions of one SDK.
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      aws-sdk:
        patterns:
          - "github.com/aws/*"
      testcontainers:
        patterns:
          - "github.com/testcontainers/*"
          - "github.com/moby/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Supply-chain cooldown: only propose releases at least 14 days old, so a
    # yanked or compromised version is usually caught before it lands here.
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci(deps):"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5

  # Dockerfile base images (Go toolchain and Alpine runtime).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Supply-chain cooldown: only propose releases at least 14 days old, so a
    # yanked or compromised version is usually caught before it lands here.
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5

  # docker-compose.yml service images (PostgreSQL, Redis, SeaweedFS, OTel
  # Collector).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    # Supply-chain cooldown: only propose releases at least 14 days old, so a
    # yanked or compromised version is usually caught before it lands here.
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
