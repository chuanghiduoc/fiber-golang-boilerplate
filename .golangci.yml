version: "2"
linters:
  enable:
    - gocritic
    - gocognit
    - gosec
    - prealloc
  settings:
    gocognit:
      # Functions above this are split into intent-named steps. Raising it
      # needs a reason in the PR; tests are exempt below.
      min-complexity: 30
    gocritic:
      enabled-tags:
        - diagnostic
        - style
    gosec:
      excludes:
        - G101
        - G304
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - gocognit
        path: _test\.go
      - linters:
          - gosec
        text: "G117"
    paths:
      - docs
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
